<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savi Bank | Your money. Your future. Made Savi.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            savi: {
              navy: '#0A192F',
              royal: '#1E3A8A',
              blue: '#3B82F6',
              light: '#F8FAFC',
              grey: '#64748B',
              green: '#10B981'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'premium': '0 20px 40px -10px rgba(14, 30, 37, 0.15)',
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    .card-gradient-1 { background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 100%); }
    .card-gradient-2 { background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%); }
    .card-gradient-3 { background: linear-gradient(135deg, #111827 0%, #374151 100%); }
    .card-gradient-green { background: linear-gradient(135deg, #047857 0%, #10B981 100%); }

    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .ticker-wrap { width: 100%; overflow: hidden; background: #0A192F; padding: 8px 0; }
    .ticker { display: flex; white-space: nowrap; animation: ticker 30s linear infinite; }
    .ticker-item { display: inline-block; padding: 0 2rem; color: #94A3B8; font-size: 0.85rem; font-weight: 500; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    /* Hide scrollbar for clean UI */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Inline SVG Icons ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const paths = {
        Logo: <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>,
        Home: <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"/>,
        CreditCard: <g><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></g>,
        Transfer: <path d="M8 3L4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>,
        Calculator: <g><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="18" x2="12" y2="18.01"/></g>,
        Support: <path d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>,
        Settings: <g><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g>,
        LogOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>,
        Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>,
        Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>,
        ArrowRight: <path d="M5 12h14M12 5l7 7-7 7"/>,
        Check: <polyline points="20 6 9 17 4 12"/>,
        User: <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/>,
        Menu: <path d="M3 12h18M3 6h18M3 18h18"/>
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name] || <circle cx="12" cy="12" r="10"/>}
        </svg>
      );
    };

    // --- Mock Data ---
    const INITIAL_TRANSACTIONS = [
      { id: 1, name: 'Apple Store', category: 'Electronics', amount: -1299.00, date: 'Today, 10:24 AM', icon: 'CreditCard' },
      { id: 2, name: 'Whole Foods Market', category: 'Groceries', amount: -156.42, date: 'Yesterday', icon: 'Home' },
      { id: 3, name: 'Direct Deposit - TechCorp', category: 'Income', amount: 4250.00, date: 'Oct 22', icon: 'Transfer' },
      { id: 4, name: 'Uber', category: 'Transport', amount: -24.50, date: 'Oct 21', icon: 'Transfer' },
      { id: 5, name: 'Starbucks', category: 'Dining', amount: -8.75, date: 'Oct 20', icon: 'Support' },
    ];

    const SPENDING_DATA = [
      { label: 'Mon', value: 120 }, { label: 'Tue', value: 300 }, { label: 'Wed', value: 150 },
      { label: 'Thu', value: 450 }, { label: 'Fri', value: 200 }, { label: 'Sat', value: 80 }, { label: 'Sun', value: 50 }
    ];

    // --- Views ---

    const LandingPage = ({ onEnter }) => (
      <div className="min-h-screen bg-slate-50 flex flex-col">
        {/* Navbar */}
        <nav className="glass-panel fixed w-full z-50 px-6 py-4 flex justify-between items-center">
          <div className="flex items-center gap-2 cursor-pointer" onClick={onEnter}>
            <div className="w-8 h-8 bg-savi-navy rounded-lg flex items-center justify-center text-white">
              <Icon name="Logo" size={20} />
            </div>
            <span className="text-xl font-bold text-savi-navy tracking-tight">Savi Bank</span>
          </div>
          <div className="hidden md:flex gap-8 text-sm font-medium text-savi-grey">
            <a href="#" className="hover:text-savi-navy transition-colors">Personal</a>
            <a href="#" className="hover:text-savi-navy transition-colors">Business</a>
            <a href="#" className="hover:text-savi-navy transition-colors">Cards</a>
            <a href="#" className="hover:text-savi-navy transition-colors">Loans</a>
          </div>
          <div className="flex gap-4 items-center">
            <button onClick={onEnter} className="text-sm font-medium text-savi-navy hover:text-savi-blue transition-colors">Sign In</button>
            <button onClick={onEnter} className="bg-savi-navy text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-savi-royal transition-colors shadow-lg shadow-savi-navy/20">Open Account</button>
          </div>
        </nav>

        {/* Hero */}
        <header className="pt-32 pb-20 px-6 md:px-20 max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-12">
          <div className="flex-1 space-y-6 fade-in">
            <h1 className="text-5xl md:text-6xl font-bold text-savi-navy leading-tight">
              Your money.<br/>Your future.<br/><span className="text-savi-blue">Made Savi.</span>
            </h1>
            <p className="text-lg text-savi-grey max-w-md">
              Modern banking for a brighter tomorrow. Simple, secure, and built entirely around you.
            </p>
            <div className="flex gap-4 pt-4">
              <button onClick={onEnter} className="bg-savi-blue text-white px-8 py-3 rounded-full font-semibold hover:bg-blue-600 transition-all shadow-xl shadow-savi-blue/30 hover:-translate-y-1">Open an Account</button>
              <button className="bg-white text-savi-navy border border-slate-200 px-8 py-3 rounded-full font-semibold hover:bg-slate-50 transition-all">Explore Offers</button>
            </div>
            <div className="flex items-center gap-6 pt-8 text-sm text-savi-grey">
              <div className="flex items-center gap-2"><Icon name="Check" size={16} className="text-savi-green"/> No hidden fees</div>
              <div className="flex items-center gap-2"><Icon name="Check" size={16} className="text-savi-green"/> Global access</div>
            </div>
          </div>
          <div className="flex-1 relative">
            <div className="absolute inset-0 bg-savi-blue rounded-full blur-3xl opacity-20 -z-10"></div>
            <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Savi Bank App" className="rounded-3xl shadow-2xl border-8 border-white" />
            <div className="absolute -bottom-6 -left-6 glass-panel p-4 rounded-2xl flex items-center gap-3 shadow-xl">
              <div className="w-10 h-10 bg-savi-green/10 rounded-full flex items-center justify-center text-savi-green"><Icon name="Check" size={20}/></div>
              <div>
                <p className="text-xs text-savi-grey font-medium">Recent Deposit</p>
                <p className="text-sm font-bold text-savi-navy">+$4,250.00</p>
              </div>
            </div>
          </div>
        </header>

        {/* Feature Highlights */}
        <section className="py-20 bg-white">
          <div className="max-w-7xl mx-auto px-6 md:px-20 text-center">
            <h2 className="text-3xl font-bold text-savi-navy mb-12">Everything you need. Nothing you don't.</h2>
            <div className="grid md:grid-cols-3 gap-8">
              {[
                { title: 'Smart Savings', desc: 'Set goals, automate deposits, and watch your money grow with 4.25% APY.', icon: 'Calculator' },
                { title: 'Premium Cards', desc: 'Metal cards, exclusive rewards, and zero foreign transaction fees.', icon: 'CreditCard' },
                { title: 'Instant Transfers', desc: 'Send money to friends, family, or businesses in seconds, 24/7.', icon: 'Transfer' }
              ].map((f, i) => (
                <div key={i} className="p-8 rounded-3xl bg-slate-50 border border-slate-100 hover:border-savi-blue/30 transition-colors">
                  <div className="w-12 h-12 bg-savi-navy rounded-2xl flex items-center justify-center text-white mb-6 shadow-lg"><Icon name={f.icon} /></div>
                  <h3 className="text-xl font-bold text-savi-navy mb-3">{f.title}</h3>
                  <p className="text-savi-grey">{f.desc}</p>
                </div>
              ))}
            </div>
          </div>
        </section>

        <footer className="bg-savi-navy text-slate-400 py-12 text-center text-sm">
          <p>© 2026 Savi Bank. All rights reserved.</p>
          <p className="mt-2 text-xs opacity-50">Demo — Not a real bank. No real funds are processed.</p>
        </footer>
      </div>
    );

    const Login = ({ onLogin }) => (
      <div className="min-h-screen bg-savi-light flex items-center justify-center p-4">
        <div className="bg-white p-10 rounded-3xl w-full max-w-md shadow-premium border border-slate-100 fade-in">
          <div className="text-center mb-8">
            <div className="w-16 h-16 bg-savi-navy rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg">
              <Icon name="Logo" size={32} className="text-white" />
            </div>
            <h1 className="text-2xl font-bold text-savi-navy mb-2">Welcome back</h1>
            <p className="text-savi-grey text-sm">Enter your details to access your dashboard.</p>
          </div>
          <div className="space-y-5">
            <div>
              <label className="text-sm font-medium text-savi-navy mb-1 block">Email Address</label>
              <input type="email" defaultValue="demo@savibank.com" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-savi-navy focus:outline-none focus:ring-2 focus:ring-savi-blue/20 focus:border-savi-blue transition-all" />
            </div>
            <div>
              <label className="text-sm font-medium text-savi-navy mb-1 block">Password</label>
              <input type="password" defaultValue="password123" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-savi-navy focus:outline-none focus:ring-2 focus:ring-savi-blue/20 focus:border-savi-blue transition-all" />
            </div>
            <button onClick={onLogin} className="w-full bg-savi-blue text-white font-semibold py-3.5 rounded-xl hover:bg-blue-600 transition-all shadow-lg shadow-savi-blue/30 flex justify-center items-center gap-2">
              Sign In <Icon name="ArrowRight" size={18} />
            </button>
          </div>
        </div>
      </div>
    );

    const Dashboard = ({ balance, transactions }) => {
      const maxSpend = Math.max(...SPENDING_DATA.map(d => d.value));
      
      return (
        <div className="space-y-8 fade-in">
          <header className="flex justify-between items-end mb-8">
            <div>
              <h2 className="text-3xl font-bold text-savi-navy">Good morning, John</h2>
              <p className="text-savi-grey mt-1">Here is your financial overview for today.</p>
            </div>
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 bg-savi-navy rounded-full flex items-center justify-center font-bold text-white shadow-lg cursor-pointer">JD</div>
            </div>
          </header>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Main Balance Card */}
            <div className="md:col-span-2 card-gradient-1 rounded-3xl p-8 relative overflow-hidden shadow-2xl text-white">
              <div className="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -mr-20 -mt-20"></div>
              <p className="text-slate-300 mb-2 font-medium tracking-wide">Total Checking Balance</p>
              <h3 className="text-5xl font-bold mb-8">${balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}</h3>
              <div className="flex gap-4">
                <button className="bg-white text-savi-navy px-6 py-2.5 rounded-xl font-semibold text-sm hover:bg-slate-100 transition-colors">Transfer</button>
                <button className="bg-white/10 border border-white/20 text-white px-6 py-2.5 rounded-xl font-semibold text-sm hover:bg-white/20 transition-colors">Deposit</button>
              </div>
            </div>

            {/* Quick Stats */}
            <div className="space-y-4">
              <div className="bg-white p-6 rounded-3xl shadow-premium border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-sm text-savi-grey mb-1">Credit Card</p>
                  <p className="text-2xl font-bold text-savi-navy">-$3,240.50</p>
                </div>
                <div className="w-12 h-12 bg-savi-blue/10 rounded-2xl flex items-center justify-center text-savi-blue"><Icon name="CreditCard" /></div>
              </div>
              <div className="bg-white p-6 rounded-3xl shadow-premium border border-slate-100 flex items-center justify-between">
                <div>
                  <p className="text-sm text-savi-grey mb-1">Savings APY</p>
                  <p className="text-2xl font-bold text-savi-green">4.25%</p>
                </div>
                <div className="w-12 h-12 bg-savi-green/10 rounded-2xl flex items-center justify-center text-savi-green"><Icon name="Calculator" /></div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            {/* Pure CSS Chart */}
            <div className="bg-white rounded-3xl p-8 shadow-premium border border-slate-100">
              <h4 className="font-bold text-savi-navy mb-6">Weekly Spending</h4>
              <div className="flex items-end justify-between h-48 gap-3">
                {SPENDING_DATA.map((d, i) => (
                  <div key={i} className="flex flex-col items-center flex-1 gap-2 group">
                    <div className="w-full bg-slate-100 rounded-t-lg relative flex items-end overflow-hidden" style={{ height: '100%' }}>
                      <div className="w-full bg-savi-blue rounded-t-lg transition-all duration-500 group-hover:bg-savi-royal" style={{ height: `${(d.value / maxSpend) * 100}%` }}></div>
                    </div>
                    <span className="text-xs font-medium text-savi-grey">{d.label}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Recent Transactions */}
            <div className="bg-white rounded-3xl p-8 shadow-premium border border-slate-100">
              <div className="flex justify-between items-center mb-6">
                <h4 className="font-bold text-savi-navy">Recent Transactions</h4>
                <span className="text-sm text-savi-blue font-medium cursor-pointer hover:underline">View All</span>
              </div>
              <div className="space-y-6">
                {transactions.slice(0, 4).map((tx) => (
                  <div key={tx.id} className="flex items-center justify-between group">
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center text-savi-navy group-hover:bg-savi-blue/10 group-hover:text-savi-blue transition-colors">
                        <Icon name={tx.icon} size={20} />
                      </div>
                      <div>
                        <p className="font-semibold text-savi-navy text-sm">{tx.name}</p>
                        <p className="text-xs text-savi-grey">{tx.date}</p>
                      </div>
                    </div>
                    <p className={`font-bold ${tx.amount > 0 ? 'text-savi-green' : 'text-savi-navy'}`}>
                      {tx.amount > 0 ? '+' : ''}{tx.amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}
                    </p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Transfers = ({ balance, setBalance, transactions, setTransactions }) => {
      const [amount, setAmount] = useState('');
      const [recipient, setRecipient] = useState('');
      const [success, setSuccess] = useState(false);

      const handleTransfer = (e) => {
        e.preventDefault();
        const val = parseFloat(amount);
        if (val > 0 && val <= balance && recipient) {
          setBalance(prev => prev - val);
          setTransactions([{
            id: Date.now(), name: recipient, category: 'Transfer', amount: -val, date: 'Just now', icon: 'Transfer'
          }, ...transactions]);
          setSuccess(true);
          setTimeout(() => setSuccess(false), 3000);
          setAmount('');
          setRecipient('');
        }
      };

      return (
        <div className="max-w-2xl mx-auto fade-in">
          <h2 className="text-2xl font-bold text-savi-navy mb-6">Send Money</h2>
          
          {success && (
            <div className="bg-savi-green/10 border border-savi-green/30 text-savi-green p-4 rounded-xl mb-6 flex items-center gap-3 font-medium">
              <Icon name="Check" /> Transfer completed successfully!
            </div>
          )}

          <div className="bg-white p-8 rounded-3xl shadow-premium border border-slate-100">
            <form onSubmit={handleTransfer} className="space-y-6">
              <div>
                <label className="text-sm font-medium text-savi-navy mb-2 block">From Account</label>
                <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-savi-navy font-medium focus:outline-none focus:ring-2 focus:ring-savi-blue/20">
                  <option>Checking (...4821) - ${balance.toLocaleString()}</option>
                </select>
              </div>
              
              <div>
                <label className="text-sm font-medium text-savi-navy mb-2 block">To (Recipient Name)</label>
                <input type="text" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder="e.g. Sarah Smith" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-savi-navy focus:outline-none focus:ring-2 focus:ring-savi-blue/20" required />
              </div>

              <div>
                <label className="text-sm font-medium text-savi-navy mb-2 block">Amount</label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-savi-grey font-bold text-lg">$</span>
                  <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-3.5 text-savi-navy focus:outline-none focus:ring-2 focus:ring-savi-blue/20 text-lg font-bold" required />
                </div>
              </div>

              <button type="submit" className="w-full bg-savi-navy hover:bg-savi-royal text-white font-semibold py-4 rounded-xl transition-all shadow-lg">
                Send Transfer
              </button>
            </form>
          </div>
        </div>
      );
    };

    const Cards = () => {
      const [isLocked, setIsLocked] = useState(false);

      return (
        <div className="max-w-4xl mx-auto fade-in">
          <h2 className="text-2xl font-bold text-savi-navy mb-6">Your Cards</h2>
          
          <div className="grid md:grid-cols-2 gap-10">
            {/* Premium Virtual Card */}
            <div className={`card-gradient-3 rounded-3xl p-8 aspect-[1.586/1] flex flex-col justify-between shadow-2xl transition-all duration-500 ${isLocked ? 'grayscale opacity-60 scale-95' : 'hover:scale-105 hover:-translate-y-2'}`}>
              <div className="flex justify-between items-start">
                <div className="flex items-center gap-2">
                  <Icon name="Logo" size={24} className="text-white/80" />
                  <span className="font-semibold text-white/80 tracking-wider">SAVI</span>
                </div>
                <span className="font-bold text-white/90 italic text-xl">VISA</span>
              </div>
              
              <div className="space-y-6">
                <div className="w-12 h-9 bg-gradient-to-br from-yellow-300 to-yellow-600 rounded-md shadow-inner flex items-center justify-center relative overflow-hidden">
                  <div className="absolute inset-0 border border-yellow-700/30 rounded-md"></div>
                  <div className="w-6 h-6 border border-yellow-800/30 rounded-full"></div>
                </div>
                <div>
                  <p className="text-slate-400 text-xs tracking-widest mb-1">CARD NUMBER</p>
                  <p className="text-xl md:text-2xl tracking-[0.15em] font-mono text-white">•••• •••• •••• 4821</p>
                </div>
                <div className="flex justify-between items-end">
                  <div>
                    <p className="text-slate-400 text-[10px] tracking-widest mb-1">CARDHOLDER</p>
                    <p className="text-sm font-medium text-white tracking-wider">JOHN DOE</p>
                  </div>
                  <div>
                    <p className="text-slate-400 text-[10px] tracking-widest mb-1">EXPIRES</p>
                    <p className="text-sm font-medium text-white tracking-wider">12/28</p>
                  </div>
                </div>
              </div>
            </div>

            {/* Card Controls */}
            <div className="space-y-4">
              <div className="bg-white p-6 rounded-3xl shadow-premium border border-slate-100 flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <div className={`w-12 h-12 rounded-2xl flex items-center justify-center transition-colors ${isLocked ? 'bg-red-50 text-red-500' : 'bg-savi-green/10 text-savi-green'}`}>
                    <Icon name={isLocked ? "Lock" : "Unlock"} size={24} />
                  </div>
                  <div>
                    <p className="font-bold text-savi-navy">Lock Card</p>
                    <p className="text-xs text-savi-grey">Temporarily disable all transactions</p>
                  </div>
                </div>
                <button onClick={() => setIsLocked(!isLocked)} className={`w-14 h-8 rounded-full transition-colors relative ${isLocked ? 'bg-red-500' : 'bg-slate-200'}`}>
                  <div className={`w-6 h-6 bg-white rounded-full absolute top-1 shadow-sm transition-transform ${isLocked ? 'translate-x-7' : 'translate-x-1'}`}></div>
                </button>
              </div>

              <div className="bg-white p-6 rounded-3xl shadow-premium border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-2xl bg-savi-blue/10 flex items-center justify-center text-savi-blue"><Icon name="Settings" size={24} /></div>
                  <div>
                    <p className="font-bold text-savi-navy">Set PIN</p>
                    <p className="text-xs text-savi-grey">Change your card's security PIN</p>
                  </div>
                </div>
                <Icon name="ArrowRight" className="text-slate-300" />
              </div>

              <div className="bg-white p-6 rounded-3xl shadow-premium border border-slate-100 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-2xl bg-purple-50 flex items-center justify-center text-purple-500"><Icon name="CreditCard" size={24} /></div>
                  <div>
                    <p className="font-bold text-savi-navy">Add to Mobile Wallet</p>
                    <p className="text-xs text-savi-grey">Apple Pay, Google Pay, Samsung Pay</p>
                  </div>
                </div>
                <Icon name="ArrowRight" className="text-slate-300" />
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Loans = () => {
      const [amount, setAmount] = useState(25000);
      const [term, setTerm] = useState(5);
      const rate = 0.065;

      const monthlyPayment = useMemo(() => {
        const monthlyRate = rate / 12;
        const numPayments = term * 12;
        const payment = (amount * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -numPayments));
        return payment.toFixed(2);
      }, [amount, term]);

      return (
        <div className="max-w-3xl mx-auto fade-in">
          <h2 className="text-2xl font-bold text-savi-navy mb-6">Loan Calculator</h2>
          <div className="bg-white p-8 rounded-3xl shadow-premium border border-slate-100">
            <div className="space-y-8">
              <div>
                <div className="flex justify-between mb-4">
                  <label className="text-sm font-bold text-savi-navy">Loan Amount</label>
                  <span className="text-lg font-bold text-savi-blue">${amount.toLocaleString()}</span>
                </div>
                <input type="range" min="1000" max="100000" step="1000" value={amount} onChange={(e) => setAmount(Number(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-savi-blue" />
              </div>

              <div>
                <div className="flex justify-between mb-4">
                  <label className="text-sm font-bold text-savi-navy">Term (Years)</label>
                  <span className="text-lg font-bold text-savi-blue">{term} years</span>
                </div>
                <input type="range" min="1" max="15" step="1" value={term} onChange={(e) => setTerm(Number(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-savi-blue" />
              </div>

              <div className="pt-8 border-t border-slate-100 flex flex-col items-center justify-center text-center">
                <p className="text-savi-grey font-medium mb-2">Estimated Monthly Payment</p>
                <p className="text-5xl font-bold text-savi-navy mb-2">${monthlyPayment}</p>
                <p className="text-sm text-savi-grey">Based on a fixed {(rate * 100).toFixed(2)}% APR</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const AppLayout = ({ children, activeTab, setActiveTab, onLogout }) => (
      <div className="min-h-screen bg-savi-light flex">
        {/* Desktop Sidebar */}
        <aside className="w-64 bg-white border-r border-slate-100 hidden md:flex flex-col z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
          <div className="p-8 flex items-center gap-3">
            <div className="w-10 h-10 bg-savi-navy rounded-xl flex items-center justify-center shadow-lg shadow-savi-navy/20">
              <Icon name="Logo" size={24} className="text-white" />
            </div>
            <span className="text-xl font-bold text-savi-navy tracking-tight">Savi Bank</span>
          </div>
          
          <nav className="flex-1 px-4 space-y-2 mt-4">
            {[
              { id: 'dashboard', label: 'Dashboard', icon: 'Home' },
              { id: 'transfers', label: 'Transfers', icon: 'Transfer' },
              { id: 'cards', label: 'Cards', icon: 'CreditCard' },
              { id: 'loans', label: 'Loans', icon: 'Calculator' },
            ].map(item => (
              <button 
                key={item.id} 
                onClick={() => setActiveTab(item.id)}
                className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold transition-all ${activeTab === item.id ? 'bg-savi-navy text-white shadow-md' : 'text-savi-grey hover:bg-slate-50 hover:text-savi-navy'}`}
              >
                <Icon name={item.icon} size={18} /> {item.label}
              </button>
            ))}
          </nav>
          
          <div className="p-4 border-t border-slate-100">
            <button onClick={onLogout} className="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-sm font-semibold text-savi-grey hover:bg-red-50 hover:text-red-500 transition-colors">
              <Icon name="LogOut" size={18} /> Sign Out
            </button>
          </div>
        </aside>

        {/* Main Content */}
        <main className="flex-1 flex flex-col h-screen overflow-hidden">
          {/* Mobile Header */}
          <header className="md:hidden bg-white p-4 flex justify-between items-center sticky top-0 z-20 border-b border-slate-100">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 bg-savi-navy rounded-lg flex items-center justify-center">
                <Icon name="Logo" size={16} className="text-white" />
              </div>
              <span className="text-lg font-bold text-savi-navy">Savi Bank</span>
            </div>
            <button className="text-savi-navy p-2"><Icon name="Menu" /></button>
          </header>

          {/* Scrollable Area */}
          <div className="flex-1 overflow-y-auto p-4 md:p-10 no-scrollbar">
            <div className="max-w-6xl mx-auto pb-20">
              {children}
            </div>
          </div>
          
          {/* Subtle Demo Footer */}
          <footer className="text-center py-3 text-[10px] text-slate-400 bg-white border-t border-slate-100 z-10 relative">
            Demo Application — Not a real bank. All data is simulated.
          </footer>
        </main>
      </div>
    );

    const App = () => {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [balance, setBalance] = useState(12450.75);
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);

      if (!isAuthenticated) {
        if (showLogin) return <Login onLogin={() => setIsAuthenticated(true)} />;
        return <LandingPage onEnter={() => setShowLogin(true)} />;
      }

      return (
        <AppLayout activeTab={activeTab} setActiveTab={setActiveTab} onLogout={() => { setIsAuthenticated(false); setShowLogin(false); }}>
          {activeTab === 'dashboard' && <Dashboard balance={balance} transactions={transactions} />}
          {activeTab === 'transfers' && <Transfers balance={balance} setBalance={setBalance} transactions={transactions} setTransactions={setTransactions} />}
          {activeTab === 'cards' && <Cards />}
          {activeTab === 'loans' && <Loans />}
        </AppLayout>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
