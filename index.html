function Icon({ name, className = 'w-5 h-5', strokeWidth = 2 }) {
  const icons = (typeof window !== 'undefined' && window.lucide && window.lucide.icons) ? window.lucide.icons : null;
  const node = icons ? (icons[name] || icons[pascal(name)] || null) : null;

    return (
      <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor"

      className={className} aria-hidden="true" focusable="false">

function Glass({ className = '', as: Tag = 'div', children, ...rest }) {
  return <Tag className={'glass rounded-2xl shadow-xl shadow-black/20 ' + className} {...rest}>{children}</Tag>;
}

function Btn({ children, variant = 'primary', className = '', ...rest }) {

    soft:    'bg-white/10 text-slate-100 hover:bg-white/18',
    danger:  'bg-rose-500/90 text-white hover:-translate-y-0.5 hover:bg-rose-500'
  };
  return <button className={base + ' px-5 py-3 text-sm ' + variants[variant] + ' ' + className} {...rest}>{children}</button>;
}

function Toggle({ checked, onChange, label }) {
  return (
    <button type="button" role="switch" aria-checked={!!checked} aria-label={label}

      <span className={'absolute top-1 h-5 w-5 rounded-full bg-white shadow transition-all duration-300 ' + (checked ? 'left-6' : 'left-1')} />
    </button>
  );
}

function Field({ label, id, icon, hint, error, right, className = '', ...rest }) {
  const inputId = id || (label ? 'f-' + label.replace(/\W+/g, '-').toLowerCase() : undefined);
  return (
    <div className={className}>
      {label && <label htmlFor={inputId} className="mb-2 block text-sm font-medium text-slate-300">{label}</label>}
      <span className="relative block">
        {icon && <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name={icon} className="w-5 h-5" /></span>}
        <input id={inputId} aria-invalid={error ? 'true' : undefined}
          className={'w-full rounded-xl border bg-slate-950/60 py-3 text-sm text-white placeholder-slate-500 transition focus:outline-none focus:ring-2 focus:ring-sky-500/60 ' +
            (icon ? 'pl-11 ' : 'pl-4 ') + (right ? 'pr-11 ' : 'pr-4 ') + (error ? 'border-rose-500/60' : 'border-white/12')} {...rest} />
        {right && <span className="absolute right-2 top-1/2 -translate-y-1/2">{right}</span>}
      </span>
      {hint && !error && <p className="mt-1.5 text-xs text-slate-500">{hint}</p>}
      {error && <p className="mt-1.5 text-xs text-rose-400" role="alert">{error}</p>}
    </div>
  );
}

function Select({ label, id, value, onChange, options, hint, className = '' }) {
  const selectId = id || (label ? 's-' + label.replace(/\W+/g, '-').toLowerCase() : undefined);
  return (

  return (

      className={'flex items-start gap-2 rounded-xl border px-4 py-3 text-sm ' + tones[tone]}>
      <Icon name={icons[tone]} className="mt-0.5 w-4 h-4 shrink-0" />
      <span>{children}</span>
    </p>
  );
}

function Modal({ open, onClose, title, subtitle, children, footer, wide }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[70] grid place-items-center overflow-y-auto p-4" role="dialog" aria-modal="true" aria-label={title}>

function Toast({ toast }) {
  if (!toast) return null;
  const ok = toast.tone !== 'error';
  return (
    <div className="pointer-events-none fixed bottom-6 left-1/2 z-[80] w-[min(92vw,26rem)] -translate-x-1/2 animate-fadeUp" role="status" aria-live="polite">

        <span className={'grid h-8 w-8 shrink-0 place-items-center rounded-full ' + (ok ? 'bg-emerald-400/20 text-emerald-300' : 'bg-rose-400/20 text-rose-300')}>
          <Icon name={ok ? 'check' : 'alert-circle'} className="w-4 h-4" />
        </span>
        <p className="text-sm font-medium text-white">{toast.msg}</p>

    </div>
  );
}

/* Resilient image: falls back to a styled placeholder if the photo fails */
function Img({ src, alt, className, fallback = 'Savi Bank' }) {
  const [failed, setFailed] = useState(false);
  const safe = failed
    ? 'https://placehold.co/1200x800/0b1224/7dd3fc?text=' + encodeURIComponent(fallback)
    : src;
  return <img src={safe} alt={alt} loading="lazy" decoding="async" onError={() => setFailed(true)} className={className} />;
}

/* Simple sparkline helper */
function Sparkline({ data, color = '#38bdf8', height = 48 }) {
  if (!ResponsiveContainer) return <div style={{ height }} />;
  const gid = 'spark-' + color.replace('#', '');
  return (
    <div style={{ height }} aria-hidden="true">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={data} margin={{ top: 4, right: 0, bottom: 0, left: 0 }}>
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity={0.5} />
              <stop offset="100%" stopColor={color} stopOpacity={0} />
            </linearGradient>
          </defs>
          <Area type="monotone" dataKey="v" stroke={color} strokeWidth={2} fill={'url(#' + gid + ')'} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function ChartTooltip({ active, payload, percent }) {
  if (!active || !payload || !payload.length) return null;
  const p = payload[0];
  const row = p.payload || {};
  return (
    <div className="rounded-xl border border-white/15 bg-slate-900/95 px-3 py-2 text-xs shadow-2xl backdrop-blur">
      <p className="text-slate-400">{row.m || row.name || ''}</p>
      <p className="num font-semibold text-white">
        {percent && typeof row.pct === 'number' ? row.pct.toFixed(1) + '%' : fmt(p.value)}
      </p>
    </div>
  );
}

/* ================================= AUTH ================================= */
function Auth({ onSignIn, onBack }) {
  const [mode, setMode] = useState('login');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [show, setShow] = useState(false);
  const [remember, setRemember] = useState(true);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);
  const [error, setError] = useState('');

  const submit = (e) => {
    e.preventDefault();
    setError('');
    if (mode === 'signup' && !name.trim()) { setError('Please enter your full name.'); return; }
    if (!email.trim() || !password.trim()) { setError('Please enter your email and password to continue.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) { setError('That email address does not look right.'); return; }
    if (password.length < 6) { setError('Passwords must be at least 6 characters.'); return; }

    setBusy(true);
    window.setTimeout(() => {
      setBusy(false);
      setDone(true);
      window.setTimeout(() => onSignIn(name.trim() || email.trim().split('@')[0]), 700);
    }, 900);
  };

  return (
    <div className="relative flex min-h-screen items-center justify-center overflow-hidden px-5 py-10">
      <div className="pointer-events-none absolute -left-32 top-10 h-96 w-96 rounded-full bg-royal-600/20 blur-3xl" />
      <div className="pointer-events-none absolute -right-32 bottom-0 h-96 w-96 rounded-full bg-emerald-500/20 blur-3xl" />

      <div className="relative w-full max-w-md animate-fadeUp">
        <button onClick={onBack}
          className="mb-6 inline-flex items-center gap-2 rounded-lg text-sm text-slate-400 transition hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
          <Icon name="arrow-left" className="w-4 h-4" /> Back to Savi Bank
        </button>

        <div className="text-center">
          <div className="flex justify-center"><Logo size={64} /></div>
          <h1 className="mt-5 text-3xl font-bold tracking-tight text-white">Welcome to Savi Bank</h1>
          <p className="mt-2 text-sm text-slate-400">
            {mode === 'login' ? 'Sign in to manage your accounts.' : 'Create your Savi Bank profile in under a minute.'}
          </p>
        </div>

        <Glass className="mt-8 p-7">
          <div className="mb-6 grid grid-cols-2 gap-1 rounded-xl bg-slate-950/60 p-1" role="tablist" aria-label="Authentication mode">
            {[['login', 'Sign In'], ['signup', 'Create Account']].map(([m, label]) => (
              <button key={m} role="tab" aria-selected={mode === m} onClick={() => { setMode(m); setError(''); }}
                className={'rounded-lg py-2.5 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' +
                  (mode === m ? 'bg-gradient-to-r from-sky-500 to-emerald-400 text-slate-950' : 'text-slate-400 hover:text-white')}>
                {label}
              </button>
            ))}
          </div>

          <form onSubmit={submit} className="space-y-5" noValidate>
            {mode === 'signup' && (
              <Field label="Full name" icon="user" type="text" value={name} autoComplete="name"
                onChange={e => setName(e.target.value)} placeholder="Nova Reyes" />
            )}
            <Field label="Email address" icon="mail" type="email" value={email} autoComplete="email"
              onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
            <Field label="Password" icon="lock" type={show ? 'text' : 'password'} value={password}
              autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
              onChange={e => setPassword(e.target.value)} placeholder="••••••••"
              hint={mode === 'signup' ? 'Use at least 6 characters.' : undefined}
              right={
                <button type="button" onClick={() => setShow(s => !s)} aria-label={show ? 'Hide password' : 'Show password'}
                  className="grid h-9 w-9 place-items-center rounded-lg text-slate-400 transition hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                  <Icon name={show ? 'eye-off' : 'eye'} className="w-4 h-4" />
                </button>
              } />

            {mode === 'login' && (
              <div className="flex items-center justify-between text-sm">
                <label className="flex cursor-pointer items-center gap-2 text-slate-400">
                  <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}
                    className="h-4 w-4 rounded accent-sky-500" />
                  Remember me
                </label>
                <button type="button" onClick={() => setError('Password reset is disabled in this demonstration.')}
                  className="rounded font-medium text-sky-400 transition hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                  Forgot password?
                </button>
              </div>
            )}

            {error && <Note tone="error">{error}</Note>}

            <Btn type="submit" variant="royal" disabled={busy || done} className="w-full py-3.5">
              {busy ? (<><Icon name="loader-circle" className="w-4 h-4 animate-spin" /> Verifying…</>)
                : done ? (<><Icon name="check" className="w-4 h-4" /> Signed in</>)
                : mode === 'login' ? 'Sign In' : 'Create Account'}
            </Btn>
          </form>

          <p className="mt-6 flex items-center justify-center gap-2 text-xs text-slate-500">
            <Icon name="shield-check" className="w-3.5 h-3.5" /> Secured with 256-bit encryption
          </p>
        </Glass>

        <p className="mt-6 text-center text-xs text-slate-500">
          Any email and password will sign you in. Nothing is stored or sent anywhere.
        </p>
      </div>
    </div>
  );
}

              <span className="grid h-11 w-11 place-items-center rounded-full bg-gradient-to-br from-sky-400 to-emerald-400 text-sm font-bold text-slate-950" aria-hidden="true">{initials}</span>
            </div>
          </header>

          <main id="main" className="px-4 py-6 sm:px-8 sm:py-8">
            <div key={view} className="animate-fadeUp">{children}</div>
          </main>

          <Footer onNavigate={(target) => setView('landing-' + target)} />
        </div>
      </div>
    </div>
  );
}

/* ============================== ACCOUNTS ================================ */
function AccountsView({ accounts, txs }) {
  const [selected, setSelected] = useState('checking');
  const [query, setQuery] = useState('');
  const [filter, setFilter] = useState('all');
  const [visible, setVisible] = useState(5);

  const acct = accounts.find(a => a.id === selected) || accounts[0];

  const list = useMemo(() => {
    const q = query.trim().toLowerCase();
    return txs
      .filter(t => t.account === selected)
      .filter(t => filter === 'all' ? true : filter === 'credits' ? t.amount > 0 : t.amount < 0)
      .filter(t => !q || (t.merchant + ' ' + t.category).toLowerCase().includes(q))
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date));
  }, [txs, selected, filter, query]);

  useEffect(() => { setVisible(5); }, [selected, filter, query]);

  const shown = list.slice(0, visible);
  const credits = list.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const debits = list.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);

  return (
    <div className="mx-auto max-w-6xl space-y-6">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h2 className="text-2xl font-bold tracking-tight text-white">Accounts</h2>
          <p className="mt-1 text-sm text-slate-400">Balances, activity and details for every Savi account.</p>
        </div>
        <span className="rounded-lg border border-white/12 bg-white/5 px-3 py-1.5 text-xs font-medium text-slate-300">Updated just now</span>
      </div>

      <div className="grid gap-4 lg:grid-cols-3">
        {accounts.map(a => {
          const active = selected === a.id;
          return (
            <button key={a.id} onClick={() => setSelected(a.id)} aria-pressed={active}
              className={'glow-hover glass rounded-2xl p-5 text-left transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' + (active ? 'ring-2 ring-sky-400/60' : '')}>
              <div className="flex items-center justify-between">
                <span className={'grid h-11 w-11 place-items-center rounded-xl bg-gradient-to-br text-slate-950 ' + a.accent}>
                  <Icon name={a.icon} className="w-5 h-5" />
                </span>
                <span className="rounded-lg bg-white/8 px-2.5 py-1 text-[11px] font-semibold uppercase text-slate-300">
                  {a.kind === 'credit' ? 'Credit' : 'Deposit'}
                </span>
              </div>
              <p className="mt-4 text-sm text-slate-400">{a.name}</p>
              <p className={'num mt-1 text-2xl font-bold ' + (a.balance < 0 ? 'text-rose-300' : 'text-white')}>{fmt(a.balance)}</p>
              <div className="mt-4 flex items-center justify-between text-xs text-slate-500">
                <span className="num">•••• {a.number}</span>
                <span>{a.kind === 'credit' ? 'Limit ' + fmt0(8000) : 'Available ' + fmt(a.balance)}</span>
              </div>
              <div className="mt-3">
                <Sparkline data={BALANCE_HISTORY} color={a.id === 'savings' ? '#34d399' : a.id === 'credit' ? '#f472b6' : '#38bdf8'} height={36} />
              </div>
            </button>
          );
        })}
      </div>

      <div className="grid gap-4 sm:grid-cols-3">
        {[['Account', acct.name], ['Credits in view', fmt(credits)], ['Debits in view', fmt(debits)]].map(([k, v]) => (
          <Glass key={k} className="p-5">
            <p className="text-sm text-slate-400">{k}</p>
            <p className="num mt-1 text-lg font-semibold text-white">{v}</p>
          </Glass>
        ))}
      </div>

      <Glass className="overflow-hidden">
        <div className="flex flex-col gap-4 border-b border-white/10 p-5 lg:flex-row lg:items-center lg:justify-between">
          <div>
            <h3 className="text-lg font-semibold text-white">{acct.name} activity</h3>
            <p className="text-xs text-slate-400">{list.length} transaction{list.length === 1 ? '' : 's'} matched</p>
          </div>
          <div className="flex flex-col gap-3 sm:flex-row">
            <div className="relative">
              <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="search" className="w-4 h-4" /></span>
              <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search transactions"
                aria-label="Search transactions" type="search"
                className="w-full rounded-xl border border-white/12 bg-slate-950/60 py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/60 sm:w-64" />
            </div>
            <div className="flex gap-1 rounded-xl bg-slate-950/60 p-1" role="group" aria-label="Filter transactions">
              {[['all', 'All'], ['credits', 'Credits'], ['debits', 'Debits']].map(([v, l]) => (
                <button key={v} onClick={() => setFilter(v)} aria-pressed={filter === v}
                  className={'rounded-lg px-3.5 py-2 text-xs font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' +
                    (filter === v ? 'bg-gradient-to-r from-sky-500 to-emerald-400 text-slate-950' : 'text-slate-400 hover:text-white')}>
                  {l}
                </button>
              ))}
            </div>
          </div>
        </div>

        {shown.length === 0 ? (
          <p className="px-5 py-14 text-center text-sm text-slate-500">No transactions match your filters.</p>
        ) : (
          <div className="divide-y divide-white/5">
            {shown.map(tx => <TxRow key={tx.id} tx={tx} accounts={accounts} />)}
          </div>
        )}

        {visible < list.length && (
          <div className="border-t border-white/10 p-4 text-center">
            <Btn variant="ghost" onClick={() => setVisible(v => v + 5)}>
              Load more ({list.length - visible} remaining)
            </Btn>
          </div>
        )}
      </Glass>
    </div>
  );
}

/* ================================ CARDS ================================= */
function CardsView({ cards, setCards, notify }) {
  const [selectedId, setSelectedId] = useState(cards[0].id);
  const [details, setDetails] = useState(null);
  const [compareMode, setCompareMode] = useState(false);
  const [compareIds, setCompareIds] = useState([cards[0].id, cards[1].id]);
  const [lost, setLost] = useState(false);

  const card = cards.find(c => c.id === selectedId) || cards[0];

  const setFrozen = (id, val) => {
    const target = cards.find(c => c.id === id);
    setCards(prev => prev.map(c => c.id === id ? { ...c, frozen: val } : c));
    if (target) notify(target.name + (val ? ' frozen' : ' unfrozen'));
  };

  const toggleCompare = (id) => {
    setCompareIds(prev => {
      if (prev.includes(id)) return prev.filter(x => x !== id);
      if (prev.length >= 3) { notify('You can compare up to three cards', 'error'); return prev; }
      return [...prev, id];
    });
  };

  useEffect(() => {
    if (!compareMode && !compareIds.includes(selectedId)) setCompareIds(prev => [...prev.slice(0, 2), selectedId]);
  }, [selectedId, compareMode]);

  const compared = cards.filter(c => compareIds.includes(c.id));
  const usedPct = Math.min(100, Math.round((card.spendUsed / card.spendLimit) * 100));

  return (
    <div className="mx-auto max-w-6xl space-y-6">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <h2 className="text-2xl font-bold tracking-tight text-white">Cards</h2>
          <p className="mt-1 text-sm text-slate-400">Freeze, review and compare every card on your profile.</p>
        </div>
        <Btn variant="ghost" onClick={() => setCompareMode(m => !m)} aria-pressed={compareMode}>
          <Icon name="columns-3" className="w-4 h-4" /> {compareMode ? 'Exit compare' : 'Compare cards'}
        </Btn>
      </div>

      <div className="grid gap-6 lg:grid-cols-5">
        <div className="lg:col-span-3">
          <div className="grid gap-5 sm:grid-cols-2">
            {cards.map(c => {
              const selected = selectedId === c.id && !compareMode;
              return (
                <button key={c.id} onClick={() => compareMode ? toggleCompare(c.id) : setSelectedId(c.id)}
                  aria-pressed={compareMode ? compareIds.includes(c.id) : selected}
                  aria-label={compareMode ? (compareIds.includes(c.id) ? 'Remove ' + c.name + ' from comparison' : 'Add ' + c.name + ' to comparison') : 'Select ' + c.name}
                  className={'rounded-2xl text-left transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' + (selected ? 'ring-2 ring-sky-400/70' : '')}>
                  <div className="relative">
                    <CardArt card={c} size="sm" />
                    {c.frozen && (
                      <span className="absolute inset-0 grid place-items-center rounded-2xl bg-slate-950/60 backdrop-blur-[2px]">
                        <span className="inline-flex items-center gap-2 rounded-full bg-sky-400/20 px-3 py-1.5 text-xs font-semibold text-sky-200">
                          <Icon name="snowflake" className="w-3.5 h-3.5" /> Frozen
                        </span>
                      </span>
                    )}
                    {compareMode && (
                      <span className={'absolute right-3 top-3 grid h-6 w-6 place-items-center rounded-full border transition ' +
                        (compareIds.includes(c.id) ? 'border-emerald-400 bg-emerald-400 text-slate-950' : 'border-white/40 bg-black/30 text-transparent')}>
                        <Icon name="check" className="w-4 h-4" />
                      </span>
                    )}
                  </div>
                  <p className="mt-3 text-sm font-semibold text-white">{c.name}</p>
                  <p className="text-xs text-slate-500">•••• {c.last4} · APR {c.apr}</p>
                </button>
              );
            })}
          </div>
        </div>

        <div className="lg:col-span-2">
          <Glass className="p-6">
            <h3 className="text-lg font-semibold text-white">Card controls</h3>
            <p className="mt-1 text-sm text-slate-400">Changes apply instantly to {card.name}.</p>

            <div className="mt-5 space-y-3">
              <div className="flex items-center justify-between gap-4 rounded-xl border border-white/10 bg-white/[0.03] px-4 py-4">
                <div className="flex items-center gap-3">
                  <span className={'grid h-10 w-10 shrink-0 place-items-center rounded-lg ' + (card.frozen ? 'bg-sky-400/15 text-sky-300' : 'bg-white/8 text-slate-300')}>
                    <Icon name="snowflake" className="w-5 h-5" />
                  </span>
                  <div>
                    <p className="text-sm font-semibold text-white">Freeze card</p>
                    <p className="text-xs text-slate-500">{card.frozen ? 'New charges are blocked' : 'Card is active and usable'}</p>
                  </div>
                </div>
                <Toggle checked={card.frozen} onChange={(v) => setFrozen(card.id, v)} label={'Freeze ' + card.name} />
              </div>

              <ControlRow icon="globe-lock" title="Online payments" subtitle="E-commerce and subscriptions"
                checked={!card.frozen} onChange={() => notify('Online payment settings saved')} label="Online payments" />
              <ControlRow icon="plane" title="Travel mode" subtitle="Notify us before you fly"
                checked={false} onChange={() => notify('Travel mode saved')} label="Travel mode" />
              <ControlRow icon="bell-ring" title="Transaction alerts" subtitle="Push alert on every purchase"
                checked={true} onChange={() => notify('Alert preferences saved')} label="Transaction alerts" />
            </div>

            <div className="mt-5 grid grid-cols-2 gap-3">
              <Btn variant="soft" onClick={() => setDetails(card)}><Icon name="eye" className="w-4 h-4" /> View details</Btn>
              <Btn variant="soft" onClick={() => setLost(true)}><Icon name="alert-triangle" className="w-4 h-4" /> Report lost</Btn>
            </div>

            <div className="mt-5 rounded-xl border border-white/10 bg-slate-950/50 p-4">
              <div className="flex items-center justify-between text-xs text-slate-400">
                <span>Spend this cycle</span>
                <span className="num text-slate-200">{fmt(card.spendUsed)} of {fmt(card.spendLimit)}</span>

              <div className="mt-2 h-2 overflow-hidden rounded-full bg-white/10" role="progressbar"
                aria-valuenow={usedPct} aria-valuemin="0" aria-valuemax="100" aria-label="Card spend limit used">
                <div className="h-full rounded-full bg-gradient-to-r from-sky-400 to-emerald-400 transition-all duration-700" style={{ width: usedPct + '%' }} />
              </div>
              <div className="mt-4 space-y-1.5">
                {card.perks.map(p => (
                  <p key={p} className="flex items-center gap-2 text-xs text-slate-300">
                    <Icon name="check" className="w-3.5 h-3.5 shrink-0 text-emerald-400" /> {p}
                  </p>
                ))}
              </div>
            </div>
          </Glass>
        </div>
      </div>

      {compareMode && (
        <Glass className="p-6">
          <h3 className="text-lg font-semibold text-white">Compare cards</h3>
          <p className="mt-1 text-sm text-slate-400">{compared.length} of 3 selected.</p>
          {compared.length === 0 ? (
            <p className="mt-6 text-sm text-slate-500">Select up to three cards above to compare them side by side.</p>
          ) : (
            <div className="mt-5 overflow-x-auto">
              <table className="w-full min-w-[34rem] text-left text-sm">
                <caption className="sr-only">Comparison of selected Savi Bank cards</caption>
                <thead>

function InsightsView({ txs }) {
  const [range, setRange] = useState('month');

  const rangeFactor = range === 'month' ? 1 : range === 'quarter' ? 2.6 : 8.4;

  const spend = useMemo(() => {
    const map = {};
    txs.filter(t => t.amount < 0 && t.category !== 'Transfer').forEach(t => {
      map[t.category] = (map[t.category] || 0) + Math.abs(t.amount);
    });
    const total = Object.values(map).reduce((s, v) => s + v, 0) || 1;
    return Object.entries(map).map(([name, value]) => ({
      name, value, pct: (value / total) * 100, color: (CATEGORY_META[name] || {}).color || '#64748b'
    })).sort((a, b) => b.value - a.value);
  }, [txs]);

  const totalSpend = spend.reduce((s, d) => s + d.value, 0);
  const top = spend[0] || { name: 'No spending yet', value: 0 };
  const debits = txs.filter(t => t.amount < 0 && t.category !== 'Transfer');

  const merchants = useMemo(() => {
    const map = {};
    debits.forEach(t => { map[t.merchant] = (map[t.merchant] || 0) + Math.abs(t.amount); });
    return Object.entries(map).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 5);
  }, [txs]);

  const maxMerchant = (merchants[0] && merchants[0].value) || 1;
  const avg = debits.length ? totalSpend / debits.length : 0;

  const trend = MONTHLY_SPEND.map(r => ({ ...r, v: Math.round(r.v * (range === 'month' ? 1 : range === 'quarter' ? 1.05 : 0.98)) }));

  return (
    <div className="mx-auto max-w-6xl space-y-6">
      <div className="flex flex-wrap items-end justify-between gap-4">

          {[['month', 'This month'], ['quarter', '3 months'], ['year', '12 months']].map(([v, l]) => (
            <button key={v} onClick={() => setRange(v)} aria-pressed={range === v}
              className={'rounded-lg px-3.5 py-2 text-xs font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' +
                (range === v ? 'bg-gradient-to-r from-sky-500 to-emerald-400 text-slate-950' : 'text-slate-400 hover:text-white')}>
              {l}
            </button>
          ))}
        </div>
      </div>

      <div className="grid gap-4 sm:grid-cols-3">
        {[
          ['Total spent', fmt(totalSpend * rangeFactor), 'receipt'],
          ['Top category', top.name + (top.value ? ' · ' + fmt(top.value * rangeFactor) : ''), 'pie-chart'],
          ['Average transaction', fmt(avg), 'calculator']
        ].map(([label, value, icon]) => (
          <Glass key={label} className="glow-hover p-5">
            <div className="flex items-center justify-between gap-3">
              <p className="text-sm text-slate-400">{label}</p>
              <Icon name={icon} className="w-4 h-4 shrink-0 text-slate-500" />
            </div>
            <p className="num mt-2 truncate text-xl font-bold text-white sm:text-2xl">{value}</p>
          </Glass>
        ))}
      </div>

      <div className="grid gap-6 lg:grid-cols-2">
        <Glass className="p-6">
          <h3 className="text-lg font-semibold text-white">Spending by category</h3>
          <div className="mt-4 h-72">
            {ResponsiveContainer && spend.length > 0 ? (
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={spend} dataKey="value" nameKey="name" innerRadius={66} outerRadius={104} paddingAngle={3} stroke="none">
                    {spend.map((d, i) => <Cell key={i} fill={d.color} />)}

          </div>
          <ul className="mt-2 grid gap-2 sm:grid-cols-2">
            {spend.map(d => (
              <li key={d.name} className="flex items-center gap-2 text-sm">
                <span className="h-2.5 w-2.5 shrink-0 rounded-full" style={{ background: d.color }} aria-hidden="true" />

  );

function CalculatorsView() {
  const [tab, setTab] = useState('savings');

  /* Savings goal */
  const [goal, setGoal] = useState(15000);
  const [start, setStart] = useState(2000);
  const [months, setMonths] = useState(36);
  const monthlyRate = 0.0435 / 12;

  const monthlyNeeded = useMemo(() => {
    const n = Math.max(1, months);
    const futureValue = (c) => c * ((Math.pow(1 + monthlyRate, n) - 1) / monthlyRate) + start * Math.pow(1 + monthlyRate, n);
    if (futureValue(0) >= goal) return 0;
    let lo = 0, hi = 100000;
    for (let i = 0; i < 60; i++) {
      const mid = (lo + hi) / 2;
      if (futureValue(mid) < goal) lo = mid; else hi = mid;
    }
    return (lo + hi) / 2;
  }, [goal, start, months]);

  const projectedSavings = useMemo(() => {
    let bal = start;
    for (let i = 0; i < months; i++) bal = bal * (1 + monthlyRate) + monthlyNeeded;
    return bal;
  }, [start, months, monthlyNeeded]);

  const totalDeposited = monthlyNeeded * months + start;
  const interestEarned = Math.max(0, projectedSavings - totalDeposited);

  /* Home loan */
  const [homePrice, setHomePrice] = useState(420000);
  const [deposit, setDeposit] = useState(84000);
  const [homeRate, setHomeRate] = useState(6.25);
  const [homeYears, setHomeYears] = useState(30);

  const home = useMemo(() => {
    const principal = Math.max(0, homePrice - deposit);
    const r = homeRate / 100 / 12;
    const n = Math.max(1, homeYears * 12);
    const payment = r === 0 ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
    const total = payment * n;
    return { principal, payment, total, interest: Math.max(0, total - principal) };
  }, [homePrice, deposit, homeRate, homeYears]);

  /* Auto loan */
  const [carPrice, setCarPrice] = useState(38000);
  const [tradeIn, setTradeIn] = useState(6000);
  const [autoRate, setAutoRate] = useState(7.4);
  const [autoYears, setAutoYears] = useState(5);

  const auto = useMemo(() => {
    const principal = Math.max(0, carPrice - tradeIn);
    const r = autoRate / 100 / 12;
    const n = Math.max(1, autoYears * 12);
    const payment = r === 0 ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
    const total = payment * n;
    return { principal, payment, total, interest: Math.max(0, total - principal) };
  }, [carPrice, tradeIn, autoRate, autoYears]);

  const tabs = [
    { id: 'savings', label: 'Savings goal', icon: 'piggy-bank' },
    { id: 'home', label: 'Home loan', icon: 'home' },
    { id: 'auto', label: 'Auto loan', icon: 'car' }
  ];

  return (
    <div className="mx-auto max-w-5xl space-y-6">
      <div>
        <h2 className="text-2xl font-bold tracking-tight text-white">Calculators</h2>
        <p className="mt-1 text-sm text-slate-400">Plan with realistic numbers before you commit.</p>
      </div>

      <div className="flex flex-wrap gap-2" role="tablist" aria-label="Calculator type">
        {tabs.map(t => (
          <button key={t.id} role="tab" aria-selected={tab === t.id} onClick={() => setTab(t.id)}
            className={'glow-hover inline-flex items-center gap-2 rounded-xl border px-4 py-3 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 ' +
              (tab === t.id ? 'border-sky-400/40 bg-gradient-to-r from-sky-500/25 to-emerald-500/15 text-white' : 'border-white/12 bg-white/5 text-slate-400 hover:text-white')}>
            <Icon name={t.icon} className="w-4 h-4" /> {t.label}

            <NumInput label="Savings goal" value={goal} onChange={setGoal} min={100} step={500} />
            <NumInput label="Starting balance" value={start} onChange={setStart} min={0} step={100} />
            <NumInput label="Time to reach goal" value={months} onChange={setMonths} min={1} max={360} step={1} prefix="" suffix="mo" />

          <Glass className="p-6">
            <p className="text-sm text-slate-400">Required monthly deposit</p>
            <p className="num mt-2 text-4xl font-extrabold text-white">{fmt(monthlyNeeded)}</p>

              <StatRow label="Projected balance" value={fmt(projectedSavings)} tone="pos" />
              <StatRow label="Total deposited" value={fmt(totalDeposited)} />

                    <defs>
                      <linearGradient id="calcFill" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#34d399" stopOpacity={0.4} />
                        <stop offset="100%" stopColor="#34d399" stopOpacity={0} />
                      </linearGradient>

                    <Area type="monotone" dataKey="v" stroke="#34d399" strokeWidth={2} fill="url(#calcFill)" />
                  </AreaChart>
                </ResponsiveContainer>

      )}

      {tab === 'home' && (
        <div className="grid gap-6 lg:grid-cols-2">

            <NumInput label="Home price" value={homePrice} onChange={setHomePrice} min={0} step={5000} />
            <NumInput label="Deposit" value={deposit} onChange={setDeposit} min={0} step={1000} />
            <NumInput label="Interest rate" value={homeRate} onChange={setHomeRate} min={0} max={20} step={0.05} prefix="" suffix="% p.a." />
            <NumInput label="Loan term" value={homeYears} onChange={setHomeYears} min={1} max={40} step={1} prefix="" suffix="yrs" />
          </Glass>
          <Glass className="p-6">
            <p className="text-sm text-slate-400">Estimated monthly repayment</p>
            <p className="num mt-2 text-4xl font-extrabold text-white">{fmt(home.payment)}</p>
            <div className="mt-6 space-y-3">
              <StatRow label="Loan amount" value={fmt(home.principal)} />
              <StatRow label="Total repaid" value={fmt(home.total)} />
              <StatRow label="Total interest" value={fmt(home.interest)} tone="neg" />
              <StatRow label="Deposit ratio" value={((deposit / Math.max(1, homePrice)) * 100).toFixed(1) + '%'} />
            </div>
          </Glass>
        </div>
      )}

      {tab === 'auto' && (
        <div className="grid gap-6 lg:grid-cols-2">
          <Glass className="space-y-5 p-6">
            <NumInput label="Vehicle price" value={carPrice} onChange={setCarPrice} min={0} step={1000} />
            <NumInput label="Trade-in or deposit" value={tradeIn} onChange={setTradeIn} min={0} step={500} />
            <NumInput label="Interest rate" value={autoRate} onChange={setAutoRate} min={0} max={25} step={0.1} prefix="" suffix="% p.a." />
            <NumInput label="Loan term" value={autoYears} onChange={setAutoYears} min={1} max={8} step={1} prefix="" suffix="yrs" />
          </Glass>
          <Glass className="p-6">
            <p className="text-sm text-slate-400">Estimated monthly repayment</p>
            <p className="num mt-2 text-4xl font-extrabold text-white">{fmt(auto.payment)}</p>
            <div className="mt-6 space-y-3">
              <StatRow label="Amount financed" value={fmt(auto.principal)} />
              <StatRow label="Total repaid" value={fmt(auto.total)} />
              <StatRow label="Total interest" value={fmt(auto.interest)} tone="neg" />
            </div>
          </Glass>
        </div>
      )}

      <Glass className="p-5">
        <p className="flex items-start gap-2 text-xs leading-relaxed text-slate-500">
          <Icon name="info" className="mt-0.5 w-4 h-4 shrink-0" />
          Estimates are for illustration only and use the inputs above. Your actual rate and payment depend on
          underwriting, credit history and market conditions.
        </p>
      </Glass>
    </div>
  );
}

/* ================================ SUPPORT =============================== */
function SupportView({ notify }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(0);
  const [form, setForm] = useState({ name: '', email: '', topic: 'General', message: '' });
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState('');

  const faqs = FAQS.filter(f => (f.q + ' ' + f.a).toLowerCase().includes(q.trim().toLowerCase()));

  const submit = (e) => {
    e.preventDefault();
    setErr('');
    if (!form.name.trim()) { setErr('Please add your name.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) { setErr('Please add a valid email address.'); return; }
    if (form.message.trim().length < 10) { setErr('Please write a message of at least 10 characters.'); return; }
    setSent(true);
    notify('Message sent — we reply within two minutes');
    setForm({ name: '', email: '', topic: 'General', message: '' });
  };

  return (
    <div className="mx-auto max-w-5xl space-y-6">
      <div>
        <h2 className="text-2xl font-bold tracking-tight text-white">Support</h2>
        <p className="mt-1 text-sm text-slate-400">Search answers or message a specialist — available 24/7.</p>
      </div>

      <div className="grid gap-4 sm:grid-cols-3">
        {[
          ['Chat with us', 'Average reply under 2 minutes', 'message-circle'],
          ['Call 24/7', '1-800-SAVI-BNK', 'phone'],
          ['Email us', 'help@savibank.example', 'mail']
        ].map(([t, d, icon]) => (
          <Glass key={t} className="glow-hover flex items-center gap-4 p-5">
            <span className="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-sky-400/25 to-emerald-400/25 text-sky-300">
              <Icon name={icon} className="w-5 h-5" />
            </span>
            <div className="min-w-0">
              <p className="text-sm font-semibold text-white">{t}</p>
              <p className="truncate text-xs text-slate-400">{d}</p>
            </div>
          </Glass>
        ))}
      </div>

      <div className="grid gap-6 lg:grid-cols-2">
        <Glass className="p-6">
          <h3 className="text-lg font-semibold text-white">Help centre</h3>
          <div className="relative mt-4">
            <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"><Icon name="search" className="w-4 h-4" /></span>
            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search frequently asked questions"
              aria-label="Search frequently asked questions" type="search"
              className="w-full rounded-xl border border-white/12 bg-slate-950/60 py-3 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/60" />
          </div>
          <div className="mt-4 space-y-2">
            {faqs.length === 0 && <p className="py-10 text-center text-sm text-slate-500">No results. Try a different search term.</p>}
            {faqs.map((f, i) => (
              <div key={f.q} className="overflow-hidden rounded-xl border border-white/10 bg-white/[0.03]">
                <h4>
                  <button onClick={() => setOpen(open === i ? -1 : i)} aria-expanded={open === i}
                    className="flex w-full items-center justify-between gap-4 px-4 py-4 text-left text-sm font-semibold text-white transition hover:bg-white/[0.03] focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                    <span>{f.q}</span>
                    <Icon name={open === i ? 'minus' : 'plus'} className="w-4 h-4 shrink-0 text-sky-400" />
                  </button>
                </h4>
                {open === i && <p className="animate-fadeIn px-4 pb-4 text-sm leading-relaxed text-slate-400">{f.a}</p>}
              </div>
            ))}
          </div>
        </Glass>

        <Glass className="p-6">
          <h3 className="text-lg font-semibold text-white">Send us a message</h3>
          {sent && <div className="mt-4"><Note tone="ok">Thanks — your message is in our queue and a specialist will reply shortly.</Note></div>}
          <form onSubmit={submit} className="mt-4 space-y-4" noValidate>
            <Field label="Your name" icon="user" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} placeholder="Nova Reyes" autoComplete="name" />
            <Field label="Email" icon="mail" type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} placeholder="you@example.com" autoComplete="email" />
            <Select label="Topic" value={form.topic} onChange={e => setForm({ ...form, topic: e.target.value })}
              options={['General', 'Cards', 'Transfers', 'Loans', 'Security', 'Business'].map(t => ({ value: t, label: t }))} />
            <div>
              <label htmlFor="supportMessage" className="mb-2 block text-sm font-medium text-slate-300">Message</label>
              <textarea id="supportMessage" rows="4" value={form.message} onChange={e => setForm({ ...form, message: e.target.value })}
                placeholder="How can we help?"
                className="w-full resize-none rounded-xl border border-white/12 bg-slate-950/60 px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/60" />
            </div>
            {err && <Note tone="error">{err}</Note>}
            <Btn type="submit" variant="royal" className="w-full">Send message</Btn>
          </form>

          <div className="mt-6 flex flex-wrap items-center gap-3 border-t border-white/10 pt-5">
            <span className="text-xs text-slate-500">Follow Savi Bank</span>
            {[['twitter', 'Twitter'], ['instagram', 'Instagram'], ['linkedin', 'LinkedIn'], ['youtube', 'YouTube']].map(([s, label]) => (
              <a key={s} href="#footer" aria-label={'Savi Bank on ' + label} onClick={(e) => e.preventDefault()}
                className="grid h-9 w-9 place-items-center rounded-lg border border-white/12 text-slate-400 transition hover:-translate-y-0.5 hover:border-sky-400/40 hover:text-sky-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                <Icon name={s} className="w-4 h-4" />
              </a>
            ))}
          </div>
        </Glass>
      </div>
    </div>
  );
}

/* ========================= QUICK ACTION MODAL =========================== */
const ACTION_CONFIG = {
  deposit: { title: 'Deposit funds', subtitle: 'Move money into your Everyday Checking account.', label: 'From', icon: 'download', sign: 1, sources: DEPOSIT_SOURCES },
  bill:    { title: 'Pay a bill',    subtitle: 'Scheduled from Everyday Checking.',              label: 'Payee', icon: 'receipt',  sign: -1, sources: BILLERS },
  send:    { title: 'Send money',    subtitle: 'Sent from Everyday Checking.',                   label: 'Recipient', icon: 'send', sign: -1, sources: RECIPIENTS }
};

function ActionModal({ type, accounts, onClose, onSubmit }) {
  const config = ACTION_CONFIG[type];
  const [amount, setAmount] = useState('');
  const [target, setTarget] = useState(config ? config.sources[0] : '');
  const [err, setErr] = useState('');

  useEffect(() => {
    setAmount('');
    setErr('');
    if (config) setTarget(config.sources[0]);
  }, [type]);

  if (!config) return null;
  const checking = accounts.find(a => a.id === 'checking');

  const submit = (e) => {
    e.preventDefault();
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) { setErr('Enter an amount greater than zero.'); return; }
    if (config.sign < 0 && amt > checking.balance) {
      setErr('That exceeds your Everyday Checking balance of ' + fmt(checking.balance) + '.');
      return;
    }
    onSubmit({ type, amount: amt, target, sign: config.sign });
    onClose();
  };

  return (
    <Modal open onClose={onClose} title={config.title} subtitle={config.subtitle}>
      <form onSubmit={submit} className="space-y-5" noValidate>
        <Select label={config.label} value={target} onChange={e => setTarget(e.target.value)}
          options={config.sources.map(s => ({ value: s, label: s }))} />
        <div>
          <label htmlFor="qaAmount" className="mb-2 block text-sm font-medium text-slate-300">Amount</label>
          <div className="relative">
            <span className="num pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-lg font-semibold text-slate-500">$</span>
            <input id="qaAmount" type="number" min="0" step="0.01" inputMode="decimal" value={amount}
              onChange={e => setAmount(e.target.value)} placeholder="0.00"
              className="num w-full rounded-xl border border-white/12 bg-slate-950/60 py-3.5 pl-9 pr-4 text-lg font-semibold text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-sky-500/60" />
          </div>
          <div className="mt-3 flex flex-wrap gap-2">
            {[20, 50, 100, 250, 1000].map(v => (
              <button key={v} type="button" onClick={() => setAmount(String(v))}
                className="num rounded-lg border border-white/12 bg-white/5 px-3.5 py-2 text-xs font-semibold text-slate-300 transition hover:bg-white/12 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400">
                ${v}
              </button>
            ))}
          </div>
        </div>
        {err && <Note tone="error">{err}</Note>}
        <div className="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <Btn variant="ghost" type="button" onClick={onClose}>Cancel</Btn>
          <Btn type="submit" variant="royal"><Icon name={config.icon} className="w-4 h-4" /> {config.title}</Btn>
        </div>
      </form>
    </Modal>
  );
}

/* ================================ APP ROOT ============================== */
function App() {
  const [route, setRoute] = useState('landing');       // landing | auth | app
  const [view, setView] = useState('dashboard');
  const [accounts, setAccounts] = useState(START_ACCOUNTS);
  const [txs, setTxs] = useState(START_TX);
  const [cards, setCards] = useState(START_CARDS);
  const [user, setUser] = useState({ name: 'Nova Reyes' });
  const [toast, setToast] = useState(null);
  const [action, setAction] = useState(null);

  const notify = (msg, tone) => setToast({ msg, tone: tone || 'ok', key: uid() });

  useEffect(() => {
    if (!toast) return;
    const t = window.setTimeout(() => setToast(null), 3600);
    return () => window.clearTimeout(t);
  }, [toast]);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }, [view, route]);

  const signIn = (name) => {
    setUser({ name: name || 'Nova Reyes' });
    setRoute('app');
    setView('dashboard');
    notify('Signed in to Savi Bank');
  };

  const signOut = () => {
    setRoute('landing');
    setView('dashboard');
    setToast(null);
  };

  const pushTx = (tx) => setTxs(prev => [{ id: uid(), date: todayISO(), ...tx }, ...prev]);

  const onTransfer = (fromId, toId, amount, memo) => {
    setAccounts(prev => prev.map(a => {
      if (a.id === fromId) return { ...a, balance: a.balance - amount };
      if (a.id === toId) return { ...a, balance: a.balance + amount };
      return a;
    }));
    const fromName = (accounts.find(a => a.id === fromId) || {}).name || 'Account';
    const toName = (accounts.find(a => a.id === toId) || {}).name || 'Account';
    pushTx({ account: fromId, merchant: 'Transfer to ' + toName, category: 'Transfer', amount: -amount, note: memo });
    pushTx({ account: toId, merchant: 'Transfer from ' + fromName, category: 'Transfer', amount: amount, note: memo });
    notify(fmt(amount) + ' transferred successfully');
  };

  const onQuickAction = ({ type, amount, target, sign }) => {
    const signed = sign * amount;
    setAccounts(prev => prev.map(a => a.id === 'checking' ? { ...a, balance: a.balance + signed } : a));
    pushTx({
      account: 'checking',
      merchant: type === 'deposit' ? 'Deposit — ' + target : type === 'bill' ? target : 'Sent to ' + target,
      category: type === 'bill' ? 'Bills' : type === 'deposit' ? 'Income' : 'Transfer',
      amount: signed
    });
    notify(type === 'deposit'
      ? fmt(amount) + ' deposited'
      : type === 'bill'
        ? 'Payment of ' + fmt(amount) + ' sent to ' + target
        : fmt(amount) + ' sent to ' + target);
  };

  const goPublic = (target) => {
    setRoute('landing');
    setView('dashboard');
    window.setTimeout(() => {
      const el = document.getElementById(target);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 120);
  };

  const content = () => {
    if (route === 'landing') return <Landing onSignIn={() => setRoute('auth')} onNavigate={goPublic} />;
    if (route === 'auth')    return <Auth onSignIn={signIn} onBack={() => setRoute('landing')} />;

    return (
      <AppShell view={view} setView={setView} user={user}
        onSignOut={signOut} onGoLanding={() => { setRoute('landing'); window.scrollTo({ top: 0 }); }}>
        {view === 'dashboard'   && <Dashboard accounts={accounts} txs={txs} onNavigate={setView} onAction={setAction} />}
        {view === 'accounts'    && <AccountsView accounts={accounts} txs={txs} />}
        {view === 'cards'       && <CardsView cards={cards} setCards={setCards} notify={notify} />}
        {view === 'transfers'   && <TransfersView accounts={accounts} txs={txs} onTransfer={onTransfer} notify={notify} />}
        {view === 'insights'    && <InsightsView txs={txs} />}
        {view === 'calculators' && <CalculatorsView />}
        {view === 'support'     && <SupportView notify={notify} />}
      </AppShell>
    );
  };

  return (
    <React.Fragment>
      {content()}
      {action && <ActionModal type={action} accounts={accounts} onClose={() => setAction(null)} onSubmit={onQuickAction} />}
      <Toast toast={toast} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
