<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBank | Premium Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bank: { dark: '#0B1120', card: '#111827', accent: '#3B82F6', accentHover: '#2563EB', success: '#10B981', danger: '#EF4444' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #F3F4F6; }
    .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .premium-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ name, size = 20, className = "" }) => {
      const icons = {
        Landmark: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/></svg>,
        Home: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
        CreditCard: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>,
        LogOut: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
        Bell: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
        Plus: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        Send: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>,
        Lock: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
        Unlock: <svg width={size} height={size} className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
      };
      return icons[name] || null;
    };

    const initialTransactions = [
      { id: 1, name: 'Apple Store', category: 'Shopping', amount: -1299.00, date: 'Oct 24' },
      { id: 2, name: 'Whole Foods', category: 'Groceries', amount: -156.42, date: 'Oct 23' },
      { id: 3, name: 'Direct Deposit', category: 'Income', amount: 4250.00, date: 'Oct 22' },
      { id: 4, name: 'Uber', category: 'Transport', amount: -24.50, date: 'Oct 21' },
    ];

    const Login = ({ onLogin }) => (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl">
          <div className="text-center mb-8">
            <div className="w-16 h-16 bg-bank-accent rounded-2xl mx-auto flex items-center justify-center mb-4">
              <Icon name="Landmark" size={32} className="text-white" />
            </div>
            <h1 className="text-3xl font-bold text-white mb-2">NovaBank</h1>
            <p className="text-gray-400 text-sm">Secure Online Banking</p>
          </div>
          <div className="space-y-4">
            <div>
              <label className="text-sm text-gray-400 mb-1 block">Username</label>
              <input type="text" defaultValue="johndoe" className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent" />
            </div>
            <div>
              <label className="text-sm text-gray-400 mb-1 block">Password</label>
              <input type="password" defaultValue="password123" className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent" />
            </div>
            <button onClick={onLogin} className="w-full bg-bank-accent hover:bg-bank-accentHover text-white font-semibold py-3 rounded-lg transition-all">
              Log In
            </button>
          </div>
        </div>
      </div>
    );

    const Dashboard = ({ balance, transactions }) => (
      <div className="space-y-6">
        <header className="flex justify-between items-center mb-8">
          <div>
            <h2 className="text-2xl font-semibold text-white">Welcome back, John</h2>
            <p className="text-gray-400 text-sm">Here is your financial overview.</p>
          </div>
          <div className="flex items-center gap-4">
            <div className="p-2 bg-bank-card rounded-full"><Icon name="Bell" className="text-gray-400" /></div>
            <div className="w-10 h-10 bg-bank-accent rounded-full flex items-center justify-center font-bold text-white">JD</div>
          </div>
        </header>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="md:col-span-2 premium-card rounded-2xl p-6 relative overflow-hidden">
            <p className="text-gray-400 mb-2 font-medium">Total Checking Balance</p>
            <h3 className="text-4xl md:text-5xl font-bold text-white mb-6">${balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}</h3>
            <div className="flex gap-4">
              <button className="bg-white text-black px-6 py-2 rounded-lg font-semibold text-sm flex items-center gap-2"><Icon name="Send" size={16}/> Transfer</button>
              <button className="bg-gray-800 border border-gray-600 text-white px-6 py-2 rounded-lg font-semibold text-sm flex items-center gap-2"><Icon name="Plus" size={16}/> Deposit</button>
            </div>
          </div>

          <div className="space-y-4">
            <div className="glass-panel p-5 rounded-xl">
              <p className="text-xs text-gray-400 mb-1">Credit Card Balance</p>
              <p className="text-xl font-semibold text-white">-$3,240.50</p>
            </div>
            <div className="glass-panel p-5 rounded-xl">
              <p className="text-xs text-gray-400 mb-1">Savings APY</p>
              <p className="text-xl font-semibold text-green-400">4.25%</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
          <div className="glass-panel rounded-2xl p-6">
            <h4 className="font-semibold text-white mb-4">Weekly Spending</h4>
            <div className="flex items-end justify-between h-48 gap-2 mt-4">
              {[40, 70, 45, 90, 60, 30, 20].map((val, i) => (
                <div key={i} className="flex flex-col items-center flex-1 gap-2">
                  <div className="w-full bg-bank-accent rounded-t-sm" style={{ height: `${val}%` }}></div>
                  <span className="text-xs text-gray-500">{['M','T','W','T','F','S','S'][i]}</span>
                </div>
              ))}
            </div>
          </div>

          <div className="glass-panel rounded-2xl p-6">
            <div className="flex justify-between items-center mb-4">
              <h4 className="font-semibold text-white">Recent Transactions</h4>
            </div>
            <div className="space-y-4">
              {transactions.map((tx) => (
                <div key={tx.id} className="flex items-center justify-between">
                  <div>
                    <p className="text-sm font-medium text-white">{tx.name}</p>
                    <p className="text-xs text-gray-500">{tx.date} • {tx.category}</p>
                  </div>
                  <p className={`font-semibold ${tx.amount > 0 ? 'text-green-400' : 'text-white'}`}>
                    {tx.amount > 0 ? '+' : ''}{tx.amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}
                  </p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );

    const Cards = () => {
      const [isLocked, setIsLocked] = useState(false);
      return (
        <div className="max-w-4xl mx-auto">
          <h2 className="text-2xl font-semibold text-white mb-6">Manage Cards</h2>
          <div className="grid md:grid-cols-2 gap-8">
            <div className={`premium-card rounded-2xl p-6 aspect-[1.586/1] flex flex-col justify-between transition-all ${isLocked ? 'grayscale opacity-50' : ''}`}>
              <div className="flex justify-between items-start">
                <Icon name="Landmark" size={28} className="text-white/80" />
                <span className="font-semibold text-white/80">VISA</span>
              </div>
              <div>
                <p className="text-gray-400 text-xs mb-1">Card Number</p>
                <p className="text-xl tracking-widest font-mono text-white">•••• •••• •••• 4821</p>
              </div>
              <div className="flex justify-between items-end">
                <p className="text-sm font-medium text-white tracking-wider">JOHN DOE</p>
                <p className="text-sm font-medium text-white tracking-wider">12/28</p>
              </div>
            </div>

            <div className="space-y-4">
              <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center ${isLocked ? 'bg-red-500/10 text-red-400' : 'bg-green-500/10 text-green-400'}`}>
                    <Icon name={isLocked ? "Lock" : "Unlock"} />
                  </div>
                  <div>
                    <p className="font-medium text-white">Lock Card</p>
                    <p className="text-xs text-gray-400">Temporarily disable all transactions</p>
                  </div>
                </div>
                <button onClick={() => setIsLocked(!isLocked)} className={`w-12 h-6 rounded-full relative ${isLocked ? 'bg-red-500' : 'bg-gray-600'}`}>
                  <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${isLocked ? 'translate-x-7' : 'translate-x-1'}`}></div>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [balance] = useState(12450.75);

      if (!isLoggedIn) return <Login onLogin={() => setIsLoggedIn(true)} />;

      return (
        <div className="min-h-screen flex bg-bank-dark">
          <aside className="w-64 glass-panel border-r border-gray-800 hidden md:flex flex-col">
            <div className="p-6 flex items-center gap-3">
              <div className="w-8 h-8 bg-bank-accent rounded-lg flex items-center justify-center"><Icon name="Landmark" size={18} className="text-white" /></div>
              <span className="text-xl font-bold text-white tracking-wide">NovaBank</span>
            </div>
            <nav className="flex-1 px-4 space-y-2 mt-4">
              {[{ id: 'dashboard', label: 'Dashboard', icon: 'Home' }, { id: 'cards', label: 'Cards', icon: 'CreditCard' }].map(item => (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === item.id ? 'bg-bank-accent text-white' : 'text-gray-400 hover:text-white'}`}>
                  <Icon name={item.icon} size={18} /> {item.label}
                </button>
              ))}
            </nav>
            <div className="p-4 border-t border-gray-800">
              <button onClick={() => setIsLoggedIn(false)} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-gray-400 hover:text-red-400">
                <Icon name="LogOut" size={18} /> Sign Out
              </button>
            </div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden">
            <div className="flex-1 overflow-y-auto p-4 md:p-8">
              <div className="max-w-6xl mx-auto pb-20">
                {activeTab === 'dashboard' && <Dashboard balance={balance} transactions={initialTransactions} />}
                {activeTab === 'cards' && <Cards />}
              </div>
            </div>
            <footer className="text-center p-4 text-[10px] text-gray-600 bg-bank-dark border-t border-gray-900">Demo — Not a real bank</footer>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
