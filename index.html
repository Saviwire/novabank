<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savi Bank | Premium Wealth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              savi: { navy: '#0A192F', blue: '#1E3A8A', bright: '#2563EB', light: '#F8FAFC', grey: '#64748B', green: '#10B981', red: '#EF4444', card: '#111827', dark: '#0B1120' }
            },
            fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
            boxShadow: { premium: '0 20px 40px -10px rgba(14, 30, 37, 0.15)', glow: '0 0 20px rgba(37, 99, 235, 0.4)' }
          }
        }
      }
    </script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root"></div>
    <!-- Load React App separately -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
