<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savi Bank | Your money. Your future. Made Savi.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            savi: {
              navy: '#0A192F',
              royal: '#1E3A8A',
              blue: '#2563EB',
              light: '#F8FAFC',
              grey: '#64748B',
              green: '#10B981',
              card: '#111827'
            }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0A192F; }
    
    /* Glassmorphism */
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.4); }
    .premium-card { background: linear-gradient(135deg, #0A192F 0%, #1E3A8A 100%); box-shadow: 0 20px 40px -10px rgba(14, 30, 37, 0.3); }
    
    /* Crypto Ticker Animation */
    .crypto-ticker-container { overflow: hidden; white-space: nowrap; background: #0A192F; padding: 10px 0; }
    .crypto-ticker { display: inline-block; animation: ticker 25s linear infinite; }
    .crypto-ticker:hover { animation-play-state: paused; }
    @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }

    /* Live Notification Animation */
    .slide-in { animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    
    /* Hide scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- 50 Languages List ---
    const LANGUAGES = [
      "English", "Español", "Français", "Deutsch", "中文", "日本語", "한국어", "Português", "Русский", "العربية",
      "Italiano", "Türkçe", "Nederlands", "Polski", "Svenska", "Norsk", "Dansk", "Suomi", "Ελληνικά", "Čeština",
      "Українська", "Română", "Magyar", "български", "עברית", "हिन्दी", "বাংলা", "Tiếng Việt", "ไทย", "Bahasa Indonesia",
      "Bahasa Melayu", "Filipino", "Kiswahili", "Afrikaans", "Amharic", "Zulu", "Yoruba", "Igbo", "Hausa", "Somali",
      "Persian", "Urdu", "Tamil", "Telugu", "Marathi", "Gujarati", "Punjabi", "Malayalam", "Kannada", "Sinhala"
    ];

    // --- Icons ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const paths = {
        Logo: <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>,
        Home: <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10"/>,
        CreditCard: <g><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></g>,
        Transfer: <path d="M8 3L4 7l4 4M4 7h16M16 21l4-4-4-4M20 17H4"/>,
        Calculator: <g><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10.01"/><line x1="12" y1="10" x2="12" y2="10.01"/><line x1="16" y1="10" x2="16" y2="10.01"/><line x1="8" y1="14" x2="8" y2="14.01"/><line x1="12" y1="14" x2="12" y2="14.01"/><line x1="16" y1="14" x2="16" y2="14.01"/><line x1="8" y1="18" x2="8" y2="18.01"/><line x1="12" y1="18" x2="12" y2="18.01"/><line x1="16" y1="18" x2="16" y2="18.01"/></g>,
        Lock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>,
        Unlock: <g><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>,
        ArrowRight: <path d="M5 12h14M12 5l7 7-7 7"/>,
        Check: <polyline points="20 6 9 17 4 12"/>,
        Menu: <path d="M3 12h18M3 6h18M3 18h18"/>,
        Globe: <g><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g>,
        ChevronDown: <polyline points="6 9 12 15 18 9"/>,
        Bell: <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>,
        Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
        Briefcase: <g><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></g>,
      };
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name] || <circle cx="12" cy="12" r="10"/>}</svg>;
    };

    // --- Mock Data ---
    const MOCK_TRANSACTIONS = [
      { id: 1, name: 'Apple Store', category: 'Electronics', amount: -1299.00, date: 'Today, 10:24 AM', icon: 'CreditCard' },
      { id: 2, name: 'Whole Foods Market', category: 'Groceries', amount: -156.42, date: 'Yesterday', icon: 'Home' },
      { id: 3, name: 'Direct Deposit', category: 'Income', amount: 4250.00, date: 'Oct 22', icon: 'Transfer' },
    ];

    // --- Live Notification System ---
    const LiveNotifications = () => {
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        const fakeUsers = ['Marcus T.', 'Elena R.', 'David K.', 'Sarah M.', 'Omar A.', 'Chloe W.'];
        const fakeActions = [
          { text: 'exchanged 0.04 BTC', amount: '+$2,560.00' },
          { text: 'withdrew 1.2 ETH', amount: '+$3,744.12' },
          { text: 'bought 450 SOL', amount: '-$65,340.00' },
          { text: 'sold 1500 USDT', amount: '+$1,500.00' }
        ];

        const triggerNotification = () => {
          const user = fakeUsers[Math.floor(Math.random() * fakeUsers.length)];
          const action = fakeActions[Math.floor(Math.random() * fakeActions.length)];
          setNotification({ user, ...action });
          
          setTimeout(() => setNotification(null), 5000);
        };

        const interval = setInterval(triggerNotification, 12000);
        setTimeout(triggerNotification, 3000); // Trigger first one quickly

        return () => clearInterval(interval);
      }, []);

      if (!notification) return null;

      return (
        <div className="fixed bottom-6 left-6 z-50 slide-in">
          <div className="bg-white p-4 rounded-2xl shadow-2xl border border-slate-100 flex items-center gap-4">
            <div className="w-10 h-10 bg-savi-green/10 rounded-full flex items-center justify-center text-savi-green">
              <Icon name="Check" size={20} />
            </div>
            <div>
              <p className="text-sm font-bold text-savi-navy">{notification.user}</p>
              <p className="text-xs text-savi-grey">{notification.text}</p>
            </div>
            <p className="text-sm font-bold text-savi-green ml-4">{notification.amount}</p>
          </div>
        </div>
      );
    };

    // --- Landing Page ---
    const LandingPage = ({ onNavigate }) => {
      const [menuOpen, setMenuOpen] = useState(false);
      const [langOpen, setLangOpen] = useState(false);
      const [selectedLang, setSelectedLang] = useState('English');

      return (
        <div className="min-h-screen bg-white relative">
          <LiveNotifications />

          {/* Crypto Ticker */}
          <div className="crypto-ticker-container">
            <div className="crypto-ticker text-sm font-medium tracking-wide">
              <span className="mx-8 text-green-400">BTC $64,230.50 ▲ 2.4%</span>
              <span className="mx-8 text-red-400">ETH $3,120.10 ▼ 1.2%</span>
              <span className="mx-8 text-green-400">SOL $145.20 ▲ 5.1%</span>
              <span className="mx-8 text-green-400">BNB $580.40 ▲ 1.8%</span>
              <span className="mx-8 text-red-400">XRP $0.52 ▼ 0.5%</span>
              <span className="mx-8 text-green-400">ADA $0.45 ▲ 3.2%</span>
              {/* Duplicate for seamless loop */}
              <span className="mx-8 text-green-400">BTC $64,230.50 ▲ 2.4%</span>
              <span className="mx-8 text-red-400">ETH $3,120.10 ▼ 1.2%</span>
              <span className="mx-8 text-green-400">SOL $145.20 ▲ 5.1%</span>
              <span className="mx-8 text-green-400">BNB $580.40 ▲ 1.8%</span>
              <span className="mx-8 text-red-400">XRP $0.52 ▼ 0.5%</span>
              <span className="mx-8 text-green-400">ADA $0.45 ▲ 3.2%</span>
            </div>
          </div>

          {/* Navbar */}
          <nav className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 px-6 py-4">
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => onNavigate('home')}>
                <div className="w-8 h-8 bg-savi-navy rounded-lg flex items-center justify-center text-white"><Icon name="Logo" size={20}/></div>
                <span className="text-xl font-bold text-savi-navy">Savi Bank</span>
              </div>
              
              <div className="hidden lg:flex gap-6 text-sm font-medium text-savi-grey">
                <span onClick={() => onNavigate('checking')} className="cursor-pointer hover:text-savi-navy">Checking</span>
                <span onClick={() => onNavigate('savings')} className="cursor-pointer hover:text-savi-navy">Savings</span>
                <span onClick={() => onNavigate('cards')} className="cursor-pointer hover:text-savi-navy">Cards</span>
                <span onClick={() => onNavigate('loans')} className="cursor-pointer hover:text-savi-navy">Loans</span>
                <span onClick={() => onNavigate('business')} className="cursor-pointer hover:text-savi-navy">Business</span>
                <span onClick={() => onNavigate('crypto')} className="cursor-pointer hover:text-savi-navy">Crypto</span>
              </div>

              <div className="hidden lg:flex gap-4 items-center">
                {/* Language Selector */}
                <div className="relative">
                  <button onClick={() => setLangOpen(!langOpen)} className="flex items-center gap-1 text-sm font-medium text-savi-grey hover:text-savi-navy transition-colors">
                    <Icon name="Globe" size={16} /> {selectedLang} <Icon name="ChevronDown" size={14} />
                  </button>
                  {langOpen && (
                    <div className="absolute right-0 mt-2 w-48 bg-white border border-slate-100 rounded-xl shadow-2xl max-h-64 overflow-y-auto z-50 p-2">
                      {LANGUAGES.map((lang, i) => (
                        <div key={i} onClick={() => { setSelectedLang(lang); setLangOpen(false); }} className="px-4 py-2 text-sm text-savi-navy hover:bg-slate-50 rounded-lg cursor-pointer">
                          {lang}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <button onClick={() => onNavigate('login')} className="text-sm font-bold text-savi-navy">Sign In</button>
                <button onClick={() => onNavigate('login')} className="bg-savi-blue text-white px-5 py-2 rounded-full text-sm font-bold hover:bg-blue-700 transition-colors shadow-lg shadow-savi-blue/30">Open Account</button>
              </div>

              <button className="lg:hidden" onClick={() => setMenuOpen(!menuOpen)}><Icon name="Menu" /></button>
            </div>

            {/* Mobile Menu */}
            {menuOpen && (
              <div className="lg:hidden mt-4 bg-white border border-slate-100 rounded-xl p-4 shadow-xl flex flex-col gap-4">
                <span onClick={() => { onNavigate('checking'); setMenuOpen(false); }} className="font-medium">Checking</span>
                <span onClick={() => { onNavigate('savings'); setMenuOpen(false); }} className="font-medium">Savings</span>
                <span onClick={() => { onNavigate('cards'); setMenuOpen(false); }} className="font-medium">Cards</span>
                <span onClick={() => { onNavigate('loans'); setMenuOpen(false); }} className="font-medium">Loans</span>
                <span onClick={() => { onNavigate('login'); setMenuOpen(false); }} className="font-bold text-savi-blue">Sign In</span>
              </div>
            )}
          </nav>

          {/* Hero Section */}
          <header className="pt-24 pb-20 px-6 max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-12">
            <div className="flex-1 space-y-8">
              <h1 className="text-5xl md:text-7xl font-bold text-savi-navy leading-tight">
                Your money.<br/>Your future.<br/><span className="text-savi-blue">Made Savi.</span>
              </h1>
              <p className="text-xl text-savi-grey max-w-lg">
                Modern banking for a brighter tomorrow. Simple, secure, and built entirely around you.
              </p>
              <div className="flex gap-4">
                <button onClick={() => onNavigate('login')} className="bg-savi-blue text-white px-8 py-4 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-xl shadow-savi-blue/30">Open an Account</button>
                <button onClick={() => onNavigate('crypto')} className="bg-white text-savi-navy border border-slate-200 px-8 py-4 rounded-xl font-bold hover:bg-slate-50 transition-all">Trade Crypto</button>
              </div>
            </div>
            <div className="flex-1">
              <img src="https://images.unsplash.com/photo-1563986768609-322da13575f3?auto=format&fit=crop&w=800&q=80" alt="Premium Banking" className="rounded-3xl shadow-2xl object-cover h-[500px] w-full" />
            </div>
          </header>

          {/* Features */}
          <section className="py-20 bg-slate-50">
            <div className="max-w-7xl mx-auto px-6">
              <h2 className="text-3xl font-bold text-center text-savi-navy mb-12">Banking Built Around You</h2>
              <div className="grid md:grid-cols-4 gap-6">
                {[
                  { t: 'Everyday Checking', d: 'No monthly fees, early direct deposit.', i: 'CreditCard' },
                  { t: 'Smart Savings', d: 'Earn 4.25% APY on your balance.', i: 'Calculator' },
                  { t: 'Global Access', d: 'Use your card in 200+ countries.', i: 'Globe' },
                  { t: 'Business Banking', d: 'Tools to help your business grow.', i: 'Briefcase' }
                ].map((b, i) => (
                  <div key={i} className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div className="w-10 h-10 bg-savi-blue/10 text-savi-blue rounded-xl flex items-center justify-center mb-4"><Icon name={b.i}/></div>
                    <h3 className="font-bold text-savi-navy mb-2">{b.t}</h3>
                    <p className="text-sm text-savi-grey">{b.d}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Near Invisible Demo Footer */}
          <div className="py-8 text-center bg-white">
            <p className="text-[9px] text-slate-300/40 uppercase tracking-widest">Demo — Not a real bank</p>
          </div>
        </div>
      );
    };

    // --- Other Pages (Kept from previous master build) ---
    const CheckingPage = ({ onNavigate }) => (
      <div className="min-h-screen bg-white p-8">
        <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
        <div className="max-w-4xl mx-auto text-center space-y-8">
          <h1 className="text-4xl font-bold text-savi-navy">Savi Everyday Checking</h1>
          <p className="text-xl text-savi-grey">Banking that moves at your speed. Get a $200 welcome bonus when you open an account.</p>
          <div className="bg-savi-navy/5 p-8 rounded-3xl border border-savi-navy/10 text-left">
            <h3 className="text-xl font-bold text-savi-navy mb-4">Get a $200 Welcome Bonus</h3>
            <p className="text-savi-grey mb-4">Open a qualifying checking account and make qualifying deposits totaling $800 or more within 60 days of account opening to qualify for the example bonus.</p>
            <button onClick={() => onNavigate('login')} className="bg-savi-blue text-white px-8 py-4 rounded-xl font-bold text-lg w-full mt-4">Apply Now</button>
          </div>
        </div>
      </div>
    );

    const SavingsPage = ({ onNavigate }) => {
      const [goal, setGoal] = useState(5000);
      const [saved, setSaved] = useState(1200);
      return (
        <div className="min-h-screen bg-white p-8">
          <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
          <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-12 items-center">
            <div className="space-y-6">
              <h1 className="text-4xl font-bold text-savi-navy">Start Saving. Reach More.</h1>
              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <h3 className="font-bold text-savi-navy mb-4">Savings Goal Calculator</h3>
                <input type="range" min="1000" max="20000" step="500" value={goal} onChange={e => setGoal(Number(e.target.value))} className="w-full mb-4" />
                <div className="flex justify-between font-bold text-savi-blue mb-6">
                  <span>Current: ${saved}</span>
                  <span>Target: ${goal}</span>
                </div>
                <div className="w-full bg-slate-200 h-4 rounded-full overflow-hidden mb-6">
                  <div className="bg-savi-green h-full transition-all" style={{ width: `${(saved/goal)*100}%` }}></div>
                </div>
                <button onClick={() => setSaved(s => s + 500)} className="w-full bg-savi-green text-white py-3 rounded-xl font-bold">Add $500</button>
              </div>
            </div>
            <img src="https://images.unsplash.com/photo-1579621970588-a35d0e7ab9b6?auto=format&fit=crop&w=600&q=80" alt="Savings" className="rounded-3xl shadow-xl h-96 object-cover" />
          </div>
        </div>
      );
    };

    const CardsPage = ({ onNavigate }) => {
      const [isLocked, setIsLocked] = useState(false);
      return (
        <div className="min-h-screen bg-slate-50 p-8">
          <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
          <h1 className="text-4xl font-bold text-savi-navy text-center mb-12">Premium Cards</h1>
          <div className="max-w-xl mx-auto mt-12 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
            <div>
              <h4 className="font-bold text-savi-navy">Lock Card</h4>
              <p className="text-sm text-savi-grey">Temporarily disable all transactions</p>
            </div>
            <button onClick={() => setIsLocked(!isLocked)} className={`w-14 h-8 rounded-full relative transition-colors ${isLocked ? 'bg-red-500' : 'bg-slate-300'}`}>
              <div className={`w-6 h-6 bg-white rounded-full absolute top-1 transition-transform ${isLocked ? 'translate-x-7' : 'translate-x-1'}`}></div>
            </button>
          </div>
        </div>
      );
    };

    const LoansPage = ({ onNavigate }) => {
      const [amount, setAmount] = useState(25000);
      const [term, setTerm] = useState(5);
      const payment = useMemo(() => {
        const r = 0.065 / 12; const n = term * 12;
        return ((amount * r) / (1 - Math.pow(1 + r, -n))).toFixed(2);
      }, [amount, term]);
      return (
        <div className="min-h-screen bg-white p-8">
          <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
          <div className="max-w-4xl mx-auto bg-slate-50 p-8 rounded-3xl border border-slate-100">
            <h1 className="text-3xl font-bold text-savi-navy mb-8 text-center">Loan Calculator</h1>
            <div className="space-y-6">
              <div>
                <label className="font-bold text-savi-navy">Amount: ${amount.toLocaleString()}</label>
                <input type="range" min="5000" max="100000" step="1000" value={amount} onChange={e => setAmount(Number(e.target.value))} className="w-full mt-2" />
              </div>
              <div>
                <label className="font-bold text-savi-navy">Term: {term} Years</label>
                <input type="range" min="1" max="15" value={term} onChange={e => setTerm(Number(e.target.value))} className="w-full mt-2" />
              </div>
              <div className="text-center pt-6 border-t border-slate-200">
                <p className="text-savi-grey">Estimated Monthly Payment</p>
                <p className="text-4xl font-bold text-savi-blue">${payment}</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const BusinessPage = ({ onNavigate }) => (
      <div className="min-h-screen bg-slate-50 p-8 flex items-center justify-center">
        <div className="max-w-2xl text-center">
          <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2 justify-center"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
          <h1 className="text-4xl font-bold text-savi-navy mb-4">Savi Business</h1>
          <p className="text-lg text-savi-grey mb-8">Powerful tools to manage cash flow, accept payments, and grow your business.</p>
        </div>
      </div>
    );

    const CryptoPage = ({ onNavigate }) => (
      <div className="min-h-screen bg-savi-navy text-white p-8">
        <button onClick={() => onNavigate('home')} className="mb-8 text-savi-blue font-semibold flex items-center gap-2"><Icon name="ArrowRight" className="rotate-180"/> Back Home</button>
        <div className="max-w-4xl mx-auto">
          <h1 className="text-4xl font-bold mb-4">Crypto Markets</h1>
          <div className="grid md:grid-cols-3 gap-6 mt-8">
            <div className="bg-white/5 p-6 rounded-2xl border border-white/10">
              <p className="text-slate-400 text-sm">Bitcoin</p>
              <p className="text-2xl font-bold mb-2">$64,230.50</p>
              <p className="text-green-400 font-medium">▲ 2.4%</p>
            </div>
            <div className="bg-white/5 p-6 rounded-2xl border border-white/10">
              <p className="text-slate-400 text-sm">Ethereum</p>
              <p className="text-2xl font-bold mb-2">$3,120.10</p>
              <p className="text-red-400 font-medium">▼ 1.2%</p>
            </div>
            <div className="bg-white/5 p-6 rounded-2xl border border-white/10">
              <p className="text-slate-400 text-sm">Solana</p>
              <p className="text-2xl font-bold mb-2">$145.20</p>
              <p className="text-green-400 font-medium">▲ 5.1%</p>
            </div>
          </div>
        </div>
      </div>
    );

    const Login = ({ onLogin, onNavigate }) => (
      <div className="min-h-screen bg-savi-light flex items-center justify-center p-4">
        <div className="bg-white p-10 rounded-3xl w-full max-w-md shadow-2xl">
          <div className="text-center mb-8 cursor-pointer" onClick={() => onNavigate('home')}>
            <div className="w-16 h-16 bg-savi-navy rounded-2xl mx-auto flex items-center justify-center mb-4 text-white"><Icon name="Logo" size={32}/></div>
            <h1 className="text-2xl font-bold text-savi-navy">Welcome Back</h1>
          </div>
          <div className="space-y-4">
            <input type="email" defaultValue="demo@savibank.com" placeholder="Email" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3" />
            <input type="password" defaultValue="password" placeholder="Password" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3" />
            <button onClick={onLogin} className="w-full bg-savi-blue text-white font-bold py-3 rounded-xl hover:bg-blue-700">Sign In</button>
          </div>
        </div>
      </div>
    );

    const Dashboard = ({ onNavigate }) => (
      <div className="p-8 max-w-6xl mx-auto min-h-screen">
        <header className="flex justify-between items-center mb-8">
          <h2 className="text-3xl font-bold text-savi-navy">Dashboard</h2>
          <button onClick={() => onNavigate('home')} className="text-sm font-bold text-savi-blue">Sign Out</button>
        </header>
        <div className="grid md:grid-cols-3 gap-6 mb-8">
          <div className="premium-card rounded-3xl p-8 text-white col-span-2">
            <p className="text-slate-300 mb-2">Total Checking Balance</p>
            <h3 className="text-5xl font-bold mb-6">$12,450.75</h3>
          </div>
        </div>
        <div className="bg-white rounded-3xl p-8 shadow-sm border border-slate-100">
          <h4 className="font-bold text-savi-navy mb-6">Recent Transactions</h4>
          {MOCK_TRANSACTIONS.map(tx => (
            <div key={tx.id} className="flex justify-between items-center border-b border-slate-50 py-4">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center"><Icon name={tx.icon}/></div>
                <div>
                  <p className="font-bold text-savi-navy">{tx.name}</p>
                  <p className="text-xs text-savi-grey">{tx.date}</p>
                </div>
              </div>
              <p className={`font-bold ${tx.amount > 0 ? 'text-savi-green' : 'text-savi-navy'}`}>${Math.abs(tx.amount).toFixed(2)}</p>
            </div>
          ))}
        </div>
      </div>
    );

    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      
      return (
        <div className="relative min-h-screen">
          {currentPage === 'home' && <LandingPage onNavigate={setCurrentPage} />}
          {currentPage === 'checking' && <CheckingPage onNavigate={setCurrentPage} />}
          {currentPage === 'savings' && <SavingsPage onNavigate={setCurrentPage} />}
          {currentPage === 'cards' && <CardsPage onNavigate={setCurrentPage} />}
          {currentPage === 'loans' && <LoansPage onNavigate={setCurrentPage} />}
          {currentPage === 'business' && <BusinessPage onNavigate={setCurrentPage} />}
          {currentPage === 'crypto' && <CryptoPage onNavigate={setCurrentPage} />}
          {currentPage === 'login' && <Login onLogin={() => setCurrentPage('dashboard')} onNavigate={setCurrentPage} />}
          {currentPage === 'dashboard' && <Dashboard onNavigate={setCurrentPage} />}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
