<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaBank | Premium Banking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bank: {
              dark: '#0B1120',
              card: '#111827',
              accent: '#3B82F6',
              accentHover: '#2563EB',
              success: '#10B981',
              danger: '#EF4444',
              text: '#F3F4F6',
              muted: '#9CA3AF'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0B1120; color: #F3F4F6; }
    .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .premium-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, BarChart, Bar } = Recharts;

    // --- Components: Icons ---
    const Icon = ({ name, size = 20, className = "" }) => {
      const ref = React.useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          const icon = window.lucide.icons[name];
          if (icon) {
            const svg = window.lucide.createElement(icon);
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('class', className);
            ref.current.innerHTML = '';
            ref.current.appendChild(svg);
          }
        }
      }, [name, size, className]);
      return <span ref={ref} className={`inline-block ${className}`}></span>;
    };

    // --- Mock Data ---
    const initialTransactions = [
      { id: 1, name: 'Apple Store', category: 'Shopping', amount: -1299.00, date: 'Oct 24', icon: 'ShoppingBag' },
      { id: 2, name: 'Whole Foods', category: 'Groceries', amount: -156.42, date: 'Oct 23', icon: 'ShoppingCart' },
      { id: 3, name: 'Direct Deposit', category: 'Income', amount: 4250.00, date: 'Oct 22', icon: 'ArrowDownLeft' },
      { id: 4, name: 'Uber', category: 'Transport', amount: -24.50, date: 'Oct 21', icon: 'Car' },
      { id: 5, name: 'Starbucks', category: 'Dining', amount: -8.75, date: 'Oct 20', icon: 'Coffee' },
      { id: 6, name: 'Amazon', category: 'Shopping', amount: -112.30, date: 'Oct 19', icon: 'Package' },
    ];

    const spendingData = [
      { name: 'Mon', amount: 120 }, { name: 'Tue', amount: 300 }, { name: 'Wed', amount: 150 },
      { name: 'Thu', amount: 450 }, { name: 'Fri', amount: 200 }, { name: 'Sat', amount: 80 }, { name: 'Sun', amount: 50 }
    ];

    // --- Views ---

    const Login = ({ onLogin }) => (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl">
          <div className="text-center mb-8">
            <div className="w-16 h-16 bg-bank-accent rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-bank-accent/30">
              <Icon name="Landmark" size={32} className="text-white" />
            </div>
            <h1 className="text-3xl font-bold text-white mb-2">NovaBank</h1>
            <p className="text-bank-muted text-sm">Secure Online Banking</p>
          </div>
          <div className="space-y-4">
            <div>
              <label className="text-sm text-bank-muted mb-1 block">Username</label>
              <input type="text" defaultValue="johndoe" className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent transition-colors" />
            </div>
            <div>
              <label className="text-sm text-bank-muted mb-1 block">Password</label>
              <input type="password" defaultValue="password123" className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent transition-colors" />
            </div>
            <button onClick={onLogin} className="w-full bg-bank-accent hover:bg-bank-accentHover text-white font-semibold py-3 rounded-lg transition-all transform hover:scale-[1.02] active:scale-[0.98]">
              Log In
            </button>
            <div className="flex justify-between text-xs text-bank-accent mt-4">
              <span className="cursor-pointer hover:underline">Forgot Password?</span>
              <span className="cursor-pointer hover:underline">Enroll Now</span>
            </div>
          </div>
        </div>
      </div>
    );

    const Dashboard = ({ balance, transactions }) => (
      <div className="space-y-6 animate-fade-in">
        <header className="flex justify-between items-center mb-8">
          <div>
            <h2 className="text-2xl font-semibold text-white">Welcome back, John</h2>
            <p className="text-bank-muted text-sm">Here is your financial overview.</p>
          </div>
          <div className="flex items-center gap-4">
            <div className="p-2 bg-bank-card rounded-full cursor-pointer hover:bg-gray-800 transition-colors"><Icon name="Bell" className="text-bank-muted" /></div>
            <div className="w-10 h-10 bg-gradient-to-r from-bank-accent to-blue-400 rounded-full flex items-center justify-center font-bold text-white cursor-pointer shadow-lg shadow-bank-accent/20">JD</div>
          </div>
        </header>

        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          {/* Main Balance Card */}
          <div className="md:col-span-2 premium-card rounded-2xl p-6 relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-bank-accent/10 rounded-full blur-3xl -mr-20 -mt-20"></div>
            <p className="text-bank-muted mb-2 font-medium">Total Checking Balance</p>
            <h3 className="text-4xl md:text-5xl font-bold text-white mb-6">${balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}</h3>
            <div className="flex gap-4">
              <button className="bg-white text-black px-6 py-2 rounded-lg font-semibold text-sm hover:bg-gray-200 transition-colors flex items-center gap-2"><Icon name="Send" size={16}/> Transfer</button>
              <button className="bg-bank-dark/50 border border-gray-600 text-white px-6 py-2 rounded-lg font-semibold text-sm hover:bg-bank-dark transition-colors flex items-center gap-2"><Icon name="Plus" size={16}/> Deposit</button>
            </div>
          </div>

          {/* Quick Stats */}
          <div className="space-y-4">
            <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-bank-muted mb-1">Credit Card Balance</p>
                <p className="text-xl font-semibold text-white">-$3,240.50</p>
              </div>
              <div className="w-10 h-10 bg-red-500/10 rounded-full flex items-center justify-center"><Icon name="CreditCard" className="text-bank-danger" /></div>
            </div>
            <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-bank-muted mb-1">Savings APY</p>
                <p className="text-xl font-semibold text-white">4.25%</p>
              </div>
              <div className="w-10 h-10 bg-green-500/10 rounded-full flex items-center justify-center"><Icon name="TrendingUp" className="text-bank-success" /></div>
            </div>
            <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
              <div>
                <p className="text-xs text-bank-muted mb-1">Rewards Points</p>
                <p className="text-xl font-semibold text-white">12,450</p>
              </div>
              <div className="w-10 h-10 bg-purple-500/10 rounded-full flex items-center justify-center"><Icon name="Gift" className="text-purple-400" /></div>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
          {/* Spending Chart */}
          <div className="glass-panel rounded-2xl p-6">
            <h4 className="font-semibold text-white mb-4">Weekly Spending</h4>
            <div className="h-64 w-full">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={spendingData}>
                  <XAxis dataKey="name" stroke="#9CA3AF" fontSize={12} tickLine={false} axisLine={false} />
                  <YAxis stroke="#9CA3AF" fontSize={12} tickLine={false} axisLine={false} tickFormatter={(value) => `$${value}`} />
                  <Tooltip cursor={{fill: 'rgba(255,255,255,0.05)'}} contentStyle={{backgroundColor: '#111827', borderColor: '#374151', color: '#F3F4F6', borderRadius: '8px'}} />
                  <Bar dataKey="amount" fill="#3B82F6" radius={[4, 4, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Recent Transactions */}
          <div className="glass-panel rounded-2xl p-6">
            <div className="flex justify-between items-center mb-4">
              <h4 className="font-semibold text-white">Recent Transactions</h4>
              <span className="text-xs text-bank-accent cursor-pointer hover:underline">View All</span>
            </div>
            <div className="space-y-4">
              {transactions.slice(0, 4).map((tx) => (
                <div key={tx.id} className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.amount > 0 ? 'bg-green-500/10 text-bank-success' : 'bg-gray-700/50 text-gray-300'}`}>
                      <Icon name={tx.icon} size={18} />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-white">{tx.name}</p>
                      <p className="text-xs text-bank-muted">{tx.date} • {tx.category}</p>
                    </div>
                  </div>
                  <p className={`font-semibold ${tx.amount > 0 ? 'text-bank-success' : 'text-white'}`}>
                    {tx.amount > 0 ? '+' : ''}{tx.amount.toLocaleString('en-US', { style: 'currency', currency: 'USD' })}
                  </p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );

    const Transfers = ({ balance, setBalance, transactions, setTransactions }) => {
      const [amount, setAmount] = useState('');
      const [recipient, setRecipient] = useState('');
      const [success, setSuccess] = useState(false);

      const handleTransfer = (e) => {
        e.preventDefault();
        const val = parseFloat(amount);
        if (val > 0 && val <= balance && recipient) {
          setBalance(prev => prev - val);
          setTransactions([{
            id: Date.now(), name: recipient, category: 'Transfer', amount: -val, date: 'Just now', icon: 'Send'
          }, ...transactions]);
          setSuccess(true);
          setTimeout(() => setSuccess(false), 3000);
          setAmount('');
          setRecipient('');
        }
      };

      return (
        <div className="max-w-2xl mx-auto animate-fade-in">
          <h2 className="text-2xl font-semibold text-white mb-6">Transfer Funds</h2>
          
          {success && (
            <div className="bg-green-500/10 border border-green-500/50 text-bank-success p-4 rounded-xl mb-6 flex items-center gap-3">
              <Icon name="CheckCircle" /> Transfer completed successfully!
            </div>
          )}

          <div className="glass-panel p-6 rounded-2xl">
            <form onSubmit={handleTransfer} className="space-y-6">
              <div>
                <label className="text-sm text-bank-muted mb-2 block">From Account</label>
                <select className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent">
                  <option>Checking (...4821) - ${balance.toLocaleString()}</option>
                  <option>Savings (...1104) - $24,500.00</option>
                </select>
              </div>
              
              <div>
                <label className="text-sm text-bank-muted mb-2 block">To (Name or Account)</label>
                <input type="text" value={recipient} onChange={(e) => setRecipient(e.target.value)} placeholder="e.g. Sarah Smith" className="w-full bg-bank-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-bank-accent" required />
              </div>

              <div>
                <label className="text-sm text-bank-muted mb-2 block">Amount</label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-bank-muted font-semibold">$</span>
                  <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" className="w-full bg-bank-dark border border-gray-700 rounded-lg pl-8 pr-4 py-3 text-white focus:outline-none focus:border-bank-accent text-lg font-semibold" required />
                </div>
              </div>

              <button type="submit" className="w-full bg-bank-accent hover:bg-bank-accentHover text-white font-semibold py-3 rounded-lg transition-colors">
                Send Transfer
              </button>
            </form>
          </div>
        </div>
      );
    };

    const Cards = () => {
      const [isLocked, setIsLocked] = useState(false);

      return (
        <div className="max-w-4xl mx-auto animate-fade-in">
          <h2 className="text-2xl font-semibold text-white mb-6">Manage Cards</h2>
          
          <div className="grid md:grid-cols-2 gap-8">
            {/* Card Visual */}
            <div className="relative group perspective-1000">
              <div className={`premium-card rounded-2xl p-6 aspect-[1.586/1] flex flex-col justify-between transition-all duration-500 ${isLocked ? 'grayscale opacity-50' : ''}`}>
                <div className="flex justify-between items-start">
                  <Icon name="Landmark" size={28} className="text-white/80" />
                  <span className="font-semibold text-white/80">VISA</span>
                </div>
                <div className="space-y-4">
                  <div className="w-12 h-8 bg-yellow-500/80 rounded flex items-center justify-center">
                    <div className="w-6 h-4 border border-yellow-700/50 rounded-sm"></div>
                  </div>
                  <div>
                    <p className="text-gray-400 text-xs mb-1">Card Number</p>
                    <p className="text-xl tracking-widest font-mono text-white">•••• •••• •••• 4821</p>
                  </div>
                  <div className="flex justify-between items-end">
                    <div>
                      <p className="text-gray-400 text-[10px] mb-1">CARDHOLDER</p>
                      <p className="text-sm font-medium text-white tracking-wider">JOHN DOE</p>
                    </div>
                    <div>
                      <p className="text-gray-400 text-[10px] mb-1">EXPIRES</p>
                      <p className="text-sm font-medium text-white tracking-wider">12/28</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* Card Controls */}
            <div className="space-y-4">
              <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <div className={`w-10 h-10 rounded-full flex items-center justify-center ${isLocked ? 'bg-red-500/10 text-bank-danger' : 'bg-green-500/10 text-bank-success'}`}>
                    <Icon name={isLocked ? "Lock" : "Unlock"} />
                  </div>
                  <div>
                    <p className="font-medium text-white">Lock Card</p>
                    <p className="text-xs text-bank-muted">Temporarily disable all transactions</p>
                  </div>
                </div>
                <button onClick={() => setIsLocked(!isLocked)} className={`w-12 h-6 rounded-full transition-colors relative ${isLocked ? 'bg-bank-danger' : 'bg-gray-600'}`}>
                  <div className={`w-4 h-4 bg-white rounded-full absolute top-1 transition-transform ${isLocked ? 'translate-x-7' : 'translate-x-1'}`}></div>
                </button>
              </div>

              <div className="glass-panel p-5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-800/50 transition-colors">
                <div className="flex items-center gap-4">
                  <div className="w-10 h-10 rounded-full bg-blue-500/10 text-bank-accent flex items-center justify-center"><Icon name="Settings" /></div>
                  <div>
                    <p className="font-medium text-white">Set PIN</p>
                    <p className="text-xs text-bank-muted">Change your card's security PIN</p>
                  </div>
                </div>
                <Icon name="ChevronRight" className="text-bank-muted" />
              </div>

              <div className="glass-panel p-5 rounded-xl flex items-center justify-between cursor-pointer hover:bg-gray-800/50 transition-colors">
                <div className="flex items-center gap-4">
                  <div className="w-10 h-10 rounded-full bg-purple-500/10 text-purple-400 flex items-center justify-center"><Icon name="Smartphone" /></div>
                  <div>
                    <p className="font-medium text-white">Add to Mobile Wallet</p>
                    <p className="text-xs text-bank-muted">Apple Pay, Google Pay, Samsung Pay</p>
                  </div>
                </div>
                <Icon name="ChevronRight" className="text-bank-muted" />
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Loans = () => {
      const [amount, setAmount] = useState(25000);
      const [term, setTerm] = useState(5);
      const rate = 0.065; // 6.5%

      const monthlyPayment = useMemo(() => {
        const monthlyRate = rate / 12;
        const numPayments = term * 12;
        const payment = (amount * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -numPayments));
        return payment.toFixed(2);
      }, [amount, term]);

      return (
        <div className="max-w-3xl mx-auto animate-fade-in">
          <h2 className="text-2xl font-semibold text-white mb-6">Loan Calculator</h2>
          <div className="glass-panel p-8 rounded-2xl">
            <div className="space-y-8">
              <div>
                <div className="flex justify-between mb-2">
                  <label className="text-sm text-bank-muted font-medium">Loan Amount</label>
                  <span className="text-white font-semibold">${amount.toLocaleString()}</span>
                </div>
                <input type="range" min="1000" max="100000" step="1000" value={amount} onChange={(e) => setAmount(Number(e.target.value))} className="w-full accent-bank-accent" />
              </div>

              <div>
                <div className="flex justify-between mb-2">
                  <label className="text-sm text-bank-muted font-medium">Term (Years)</label>
                  <span className="text-white font-semibold">{term} years</span>
                </div>
                <input type="range" min="1" max="15" step="1" value={term} onChange={(e) => setTerm(Number(e.target.value))} className="w-full accent-bank-accent" />
              </div>

              <div className="pt-6 border-t border-gray-700/50 flex flex-col items-center justify-center">
                <p className="text-bank-muted mb-1">Estimated Monthly Payment</p>
                <p className="text-4xl font-bold text-bank-success">${monthlyPayment}</p>
                <p className="text-xs text-bank-muted mt-2">Based on a fixed {(rate * 100).toFixed(2)}% APR</p>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const BillPay = () => {
      const payees = [
        { id: 1, name: 'Con Edison', due: 'Oct 28', amount: 145.00, status: 'Pending' },
        { id: 2, name: 'Verizon Fios', due: 'Nov 02', amount: 89.99, status: 'Scheduled' },
        { id: 3, name: 'Geico Auto Insurance', due: 'Nov 15', amount: 120.50, status: 'Scheduled' },
      ];

      return (
        <div className="max-w-4xl mx-auto animate-fade-in">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-semibold text-white">Bill Pay</h2>
            <button className="bg-bank-accent hover:bg-bank-accentHover text-white px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2">
              <Icon name="Plus" size={16} /> Add Payee
            </button>
          </div>

          <div className="glass-panel rounded-2xl overflow-hidden">
            <div className="grid grid-cols-4 gap-4 p-4 border-b border-gray-700/50 text-xs font-semibold text-bank-muted uppercase tracking-wider">
              <div className="col-span-2">Payee</div>
              <div>Due Date</div>
              <div className="text-right">Amount</div>
            </div>
            <div className="divide-y divide-gray-700/50">
              {payees.map(p => (
                <div key={p.id} className="grid grid-cols-4 gap-4 p-4 items-center hover:bg-gray-800/30 transition-colors">
                  <div className="col-span-2 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-full bg-gray-700/50 flex items-center justify-center text-white"><Icon name="FileText" size={18} /></div>
                    <div>
                      <p className="font-medium text-white text-sm">{p.name}</p>
                      <p className={`text-xs ${p.status === 'Pending' ? 'text-yellow-400' : 'text-bank-muted'}`}>{p.status}</p>
                    </div>
                  </div>
                  <div className="text-sm text-gray-300">{p.due}</div>
                  <div className="text-right font-semibold text-white">${p.amount.toFixed(2)}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [balance, setBalance] = useState(12450.75);
      const [transactions, setTransactions] = useState(initialTransactions);

      if (!isLoggedIn) return <Login onLogin={() => setIsLoggedIn(true)} />;

      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: 'Home' },
        { id: 'transfers', label: 'Transfers', icon: 'ArrowLeftRight' },
        { id: 'cards', label: 'Cards', icon: 'CreditCard' },
        { id: 'billpay', label: 'Bill Pay', icon: 'Receipt' },
        { id: 'loans', label: 'Loans', icon: 'Landmark' },
      ];

      return (
        <div className="min-h-screen flex bg-bank-dark">
          {/* Sidebar Desktop */}
          <aside className="w-64 glass-panel border-r border-gray-800 hidden md:flex flex-col">
            <div className="p-6 flex items-center gap-3">
              <div className="w-8 h-8 bg-bank-accent rounded-lg flex items-center justify-center">
                <Icon name="Landmark" size={18} className="text-white" />
              </div>
              <span className="text-xl font-bold text-white tracking-wide">NovaBank</span>
            </div>
            
            <nav className="flex-1 px-4 space-y-2 mt-4">
              {navItems.map(item => (
                <button 
                  key={item.id} 
                  onClick={() => setActiveTab(item.id)}
                  className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${activeTab === item.id ? 'bg-bank-accent text-white shadow-lg shadow-bank-accent/20' : 'text-bank-muted hover:bg-gray-800/50 hover:text-white'}`}
                >
                  <Icon name={item.icon} size={18} /> {item.label}
                </button>
              ))}
            </nav>
            
            <div className="p-4 border-t border-gray-800">
              <button onClick={() => setIsLoggedIn(false)} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-bank-muted hover:bg-red-500/10 hover:text-red-400 transition-colors">
                <Icon name="LogOut" size={18} /> Sign Out
              </button>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 flex flex-col h-screen overflow-hidden">
            {/* Mobile Header */}
            <header className="md:hidden glass-panel p-4 flex justify-between items-center sticky top-0 z-10 border-b border-gray-800">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 bg-bank-accent rounded-lg flex items-center justify-center">
                  <Icon name="Landmark" size={18} className="text-white" />
                </div>
                <span className="text-lg font-bold text-white">NovaBank</span>
              </div>
              <button className="text-white"><Icon name="Menu" /></button>
            </header>

            {/* Scrollable Content Area */}
            <div className="flex-1 overflow-y-auto p-4 md:p-8 scrollbar-hide">
              <div className="max-w-6xl mx-auto pb-20">
                {activeTab === 'dashboard' && <Dashboard balance={balance} transactions={transactions} />}
                {activeTab === 'transfers' && <Transfers balance={balance} setBalance={setBalance} transactions={transactions} setTransactions={setTransactions} />}
                {activeTab === 'cards' && <Cards />}
                {activeTab === 'billpay' && <BillPay />}
                {activeTab === 'loans' && <Loans />}
              </div>
            </div>
            
            {/* Footer */}
            <footer className="text-center p-4 text-[10px] text-gray-600 bg-bank-dark border-t border-gray-900">
              Demo — Not a real bank
            </footer>
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
